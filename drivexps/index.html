<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DriveXPS - Roteirizador Shopee</title>
  
  <meta name="theme-color" content="#EA580C">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DriveXPS">
  
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <!-- Tailwind, Alpine.js e Leitor Nativo de Excel (SheetJS) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('ServiceWorker ativo!', reg.scope))
          .catch(err => console.error('Erro no ServiceWorker:', err));
      });
    }
  </script>
</head>
<body class="bg-gray-950 text-white font-sans pb-24 select-none" x-data="entregaApp()">

  <!-- Cabeçalho Cockpit -->
  <header class="bg-orange-600 p-3.5 sticky top-0 z-40 shadow-lg flex justify-between items-center">
    <div>
      <h1 class="font-black text-lg leading-tight">DriveXPS <span class="text-xs bg-black px-2 py-0.5 rounded font-mono" x-text="rotaAtivaId ? `Rota #${rotaAtivaId}` : 'Shopee Pro'"></span></h1>
      <p class="text-xs opacity-90 font-medium" x-text="`Restantes: ${pendentes.length} de ${entregas.length} pacotes`"></p>
    </div>
    <div class="flex items-center gap-2">
      <button @click="modalImportar = true" class="bg-white text-orange-600 px-3 py-1.5 text-xs font-black rounded-lg shadow active:scale-95 transition">
        + Carregar Rota
      </button>
      <button @click="modo = 'carregamento'" :class="modo === 'carregamento' ? 'bg-black text-white' : 'bg-orange-700'" class="px-2.5 py-1.5 text-xs font-bold rounded-lg">📦 Carga</button>
      <button @click="modo = 'rua'" :class="modo === 'rua' ? 'bg-black text-white' : 'bg-orange-700'" class="px-2.5 py-1.5 text-xs font-bold rounded-lg">🚗 Rua</button>
      <button @click="abrirHistorico()" :class="modo === 'historico' ? 'bg-black text-white' : 'bg-orange-700'" class="px-2.5 py-1.5 text-xs font-bold rounded-lg">📜</button>
    </div>
  </header>

  <!-- Barra de Navegação GPS Base -->
  <div class="bg-gray-900 px-4 py-2 border-b border-gray-800 flex justify-between text-[11px] text-gray-300">
    <button @click="modalCD = true" class="hover:underline flex items-center gap-1">
      🏭 CD Saída: <span :class="cd.lat ? 'text-green-400 font-bold' : 'text-yellow-400 font-bold'" x-text="cd.lat ? 'Configurado' : 'Pendente'"></span>
    </button>
    <button @click="modalCD = true" class="hover:underline flex items-center gap-1">
      🏠 Casa Fim: <span :class="casa.lat ? 'text-green-400 font-bold' : 'text-yellow-400 font-bold'" x-text="casa.lat ? 'Configurada' : 'Pendente'"></span>
    </button>
  </div>

  <!-- MODO 1: CARREGAMENTO (Organização Física no Uno) -->
  <main x-show="modo === 'carregamento'" class="p-4 space-y-3">
    <div class="bg-gray-900 p-3.5 rounded-xl border border-yellow-500/30 text-xs text-yellow-400 space-y-1">
      <p class="font-bold flex items-center gap-1">✍️ REGRA DO CANETÃO NO CDD:</p>
      <p class="text-gray-300 text-[11px]">Numerar os pacotes de <strong>#1 até #<span x-text="entregas.length"></span></strong> conforme a lista abaixo antes de colocar no Uno.</p>
    </div>

    <template x-for="item in entregas" :key="item.id">
      <div class="bg-gray-900 p-3.5 rounded-xl flex items-center justify-between border-l-4 transition-all"
           :class="{
             'opacity-25 line-through bg-black border-gray-700': item.status === 'entregue',
             'border-green-500': item.status !== 'entregue' && item.setor_uno === 'CABINE_FRENTE',
             'border-blue-500': item.status !== 'entregue' && item.setor_uno === 'BANCO_TRAS',
             'border-purple-500': item.status !== 'entregue' && item.setor_uno === 'MALA_FRENTE',
             'border-red-500': item.status !== 'entregue' && item.setor_uno === 'MALA_FUNDO'
           }">
        <div class="flex items-center gap-3">
          <span class="text-2xl font-black bg-gray-800 px-3 py-1.5 rounded-lg border border-gray-700" x-text="`#${item.ordem_entrega}`"></span>
          <div>
            <div class="flex items-center gap-2">
              <p class="font-bold text-sm text-white" x-text="item.endereco"></p>
              <span x-show="item.total_no_local > 1" class="text-[10px] bg-yellow-500/20 text-yellow-400 border border-yellow-500/40 px-1.5 py-0.2 rounded font-black" x-text="`${item.total_no_local} PACOTES`"></span>
            </div>
            <p class="text-xs text-gray-400" x-text="`${item.bairro} - ${item.cidade}`"></p>
            <p class="text-[10px] text-orange-400 font-mono mt-0.5" x-text="item.codigo_rastreio"></p>
          </div>
        </div>
        <div class="text-right">
          <span x-show="item.status === 'entregue'" class="text-xs font-black text-green-400">ENTREGUE</span>
          <span x-show="item.status !== 'entregue'" class="text-[10px] font-black px-2.5 py-1 rounded-md uppercase tracking-wider"
                :class="{
                  'bg-green-950 text-green-300 border border-green-800': item.setor_uno === 'CABINE_FRENTE',
                  'bg-blue-950 text-blue-300 border border-blue-800': item.setor_uno === 'BANCO_TRAS',
                  'bg-purple-950 text-purple-300 border border-purple-800': item.setor_uno === 'MALA_FRENTE',
                  'bg-red-950 text-red-300 border border-red-800': item.setor_uno === 'MALA_FUNDO'
                }" x-text="(item.setor_uno || 'CABINE_FRENTE').replace('_', ' ')"></span>
        </div>
      </div>
    </template>
  </main>

  <!-- MODO 2: RUA (Cockpit de Alta Performance) -->
  <main x-show="modo === 'rua'" class="p-4">
    <template x-if="entregaAtual">
      <div class="bg-gray-900 rounded-2xl p-5 border border-gray-800 space-y-4 shadow-2xl">
        <!-- Barra do Topo -->
        <div class="flex justify-between items-center border-b border-gray-800 pb-3">
          <div class="flex items-center gap-2">
            <span class="bg-orange-600 text-white font-black text-2xl px-3.5 py-1 rounded-xl shadow-md" x-text="`#${entregaAtual.ordem_entrega}`"></span>
            <div>
              <span class="text-[10px] text-gray-400 block font-bold uppercase">Setor no Uno:</span>
              <span class="text-xs font-black text-orange-400 uppercase tracking-wide" x-text="(entregaAtual.setor_uno || 'CABINE FRENTE').replace('_', ' ')"></span>
            </div>
          </div>
          <span class="text-xs bg-gray-800 text-orange-400 border border-gray-700 font-mono font-bold px-2.5 py-1 rounded" x-text="entregaAtual.codigo_rastreio"></span>
        </div>

        <!-- Alerta de Parada com Múltiplos Pacotes -->
        <div x-show="pacotesMesmoLocal.length > 1" class="bg-yellow-500/10 border-2 border-yellow-500/60 rounded-xl p-3 space-y-1">
          <p class="text-xs font-black text-yellow-400 flex items-center gap-1">
            ⚠️ ATENÇÃO: HÁ <span x-text="pacotesMesmoLocal.length"></span> PACOTES PARA ESTE LOCAL!
          </p>
          <p class="text-[11px] text-gray-300">Entregue todos juntos para não ter que voltar:</p>
          <div class="flex flex-wrap gap-1 pt-1">
            <template x-for="p in pacotesMesmoLocal" :key="p.id">
              <span class="bg-yellow-500/20 text-yellow-300 text-[10px] font-mono px-2 py-0.5 rounded border border-yellow-500/30" x-text="`#${p.ordem_entrega} (${p.codigo_rastreio})`"></span>
            </template>
          </div>
        </div>

        <!-- Dados do Endereço -->
        <div class="space-y-1">
          <h2 class="text-2xl font-black text-white leading-tight" x-text="entregaAtual.endereco"></h2>
          <p class="text-base text-gray-300 font-semibold" x-text="`${entregaAtual.bairro} - ${entregaAtual.cidade}`"></p>
          <p class="text-xs text-gray-400 font-mono" x-text="`CEP: ${entregaAtual.cep || 'S/N'}`"></p>
        </div>

        <!-- Navegação com 1 Toque -->
        <div class="grid grid-cols-2 gap-3 pt-2">
          <a :href="`waze://?ll=${entregaAtual.latitude},${entregaAtual.longitude}&navigate=yes`" 
             class="bg-blue-600 hover:bg-blue-500 text-center py-4 rounded-xl font-black text-base flex items-center justify-center gap-2 shadow-lg shadow-blue-600/30 active:scale-95 transition">
            🚗 Abrir Waze
          </a>
          <a :href="`google.navigation:q=${entregaAtual.latitude},${entregaAtual.longitude}`" 
             class="bg-emerald-600 hover:bg-emerald-500 text-center py-4 rounded-xl font-black text-base flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/30 active:scale-95 transition">
            🗺️ Google Maps
          </a>
        </div>

        <!-- Botões de Ação na Entrega -->
        <div class="grid grid-cols-2 gap-3 pt-3 border-t border-gray-800">
          <button @click="atualizarStatus(entregaAtual.id, 'ausente')" class="bg-gray-800 hover:bg-gray-700 text-yellow-400 py-4 rounded-xl font-bold text-sm border border-gray-700 active:scale-95 transition">
            ⚠️ Ausente / Pular
          </button>
          <button @click="concluirEntrega(entregaAtual)" class="bg-orange-600 hover:bg-orange-500 text-white py-4 rounded-xl font-black text-lg shadow-lg shadow-orange-600/40 active:scale-95 transition">
            ✅ Entregue
          </button>
        </div>
      </div>
    </template>

    <template x-if="!entregaAtual && entregas.length > 0">
      <div class="text-center py-20 space-y-4">
        <span class="text-6xl block">🏁</span>
        <h2 class="text-2xl font-black text-white" x-text="`Rota #${rotaAtivaId || ''} Finalizada!`"></h2>
        <p class="text-gray-400 text-sm max-w-xs mx-auto">Parabéns! Todos os pacotes da carga foram entregues no menor tempo possível.</p>
      </div>
    </template>
  </main>

  <!-- MODO 3: HISTÓRICO -->
  <main x-show="modo === 'historico'" class="p-4 space-y-4">
    <h2 class="text-lg font-black text-orange-500">📜 Histórico de Desempenho</h2>
    <div class="space-y-3">
      <template x-for="r in rotasHistorico" :key="r.id">
        <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-2">
          <div class="flex justify-between items-center">
            <div>
              <span class="text-base font-black text-white" x-text="`Rota #${r.id}`"></span>
              <p class="text-xs text-gray-400" x-text="`Data: ${r.data ? new Date(r.data).toLocaleDateString('pt-BR') : 'Hoje'}`"></p>
            </div>
            <span class="text-xs bg-orange-600/20 text-orange-400 border border-orange-500/30 px-3 py-1 rounded-full font-bold" x-text="`${r.total_pacotes || 0} pacotes`"></span>
          </div>
          <button @click="selecionarRotaHistorico(r.id)" class="w-full bg-gray-800 hover:bg-gray-700 text-xs py-2.5 rounded-lg font-bold text-gray-200">
            Reabrir Detalhes Desta Rota
          </button>
        </div>
      </template>
    </div>
  </main>

  <!-- MODAL: IMPORTAR PLANILHA XLSX DA SHOPEE -->
  <div x-show="modalImportar" class="fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-4" x-cloak>
    <div class="bg-gray-900 rounded-2xl w-full max-w-lg border border-gray-800 p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-gray-800 pb-3">
        <div>
          <h2 class="font-black text-lg text-orange-500">CARREGAR ROMANEIO SHOPEE</h2>
          <p class="text-xs text-gray-400">Importação oficial de alta precisão (até 300 pacotes)</p>
        </div>
        <button @click="modalImportar = false" class="text-gray-400 text-2xl font-bold">&times;</button>
      </div>

      <!-- Upload XLSX Direto -->
      <div class="space-y-3">
        <label class="block border-2 border-dashed border-orange-500/50 bg-orange-500/5 rounded-2xl p-7 text-center cursor-pointer hover:border-orange-500 hover:bg-orange-500/10 transition">
          <span class="text-4xl block mb-2">📑</span>
          <span class="text-sm font-black block text-white">Selecionar arquivo .XLSX ou .CSV</span>
          <span class="text-xs text-gray-400 block mt-1">Exportado diretamente do aplicativo SPX</span>
          <input type="file" accept=".xlsx, .xls, .csv, .txt" @change="processarArquivoExcel($event)" class="hidden">
        </label>
        
        <div x-show="pacotesExtraidos.length > 0" class="bg-green-500/10 border border-green-500/30 rounded-xl p-3 text-center">
          <p class="text-xs text-green-400 font-bold" x-text="`✅ ${pacotesExtraidos.length} pacotes lidos com sucesso da planilha!`"></p>
        </div>
      </div>

      <button @click="enviarParaN8N()" :disabled="carregandoProcesso || pacotesExtraidos.length === 0" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-black py-4 rounded-xl text-sm flex items-center justify-center gap-2 shadow-xl shadow-orange-600/30 disabled:opacity-40 transition">
        <span x-show="!carregandoProcesso" x-text="`🚀 Otimizar Sequência Mais Rápida (${pacotesExtraidos.length} pacotes)`"></span>
        <span x-show="carregandoProcesso">⏳ Calculando Rota Perfeita Sem Nós...</span>
      </button>
    </div>
  </div>

  <!-- MODAL: CONFIGURAR PONTOS CD E CASA -->
  <div x-show="modalCD" class="fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-4" x-cloak>
    <div class="bg-gray-900 rounded-2xl w-full max-w-md border border-gray-800 p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-gray-800 pb-3">
        <h2 class="font-black text-base text-orange-500">PONTOS DE PARTIDA E CHEGADA</h2>
        <button @click="modalCD = false" class="text-gray-400 text-2xl">&times;</button>
      </div>

      <div class="space-y-2 bg-gray-950 p-3.5 rounded-xl border border-gray-800">
        <label class="text-xs font-bold text-orange-400">🏭 CD SHOPEE (Partida da Rota)</label>
        <button @click="capturarLocalizacao('cd')" class="w-full bg-gray-800 hover:bg-gray-700 text-xs py-2.5 rounded-lg font-bold text-green-400 border border-gray-700">
          📍 Gravar Minha Localização Atual como CD
        </button>
        <p x-show="cd.lat" class="text-[10px] text-gray-400 font-mono" x-text="`Lat: ${cd.lat.toFixed(5)}, Lng: ${cd.lng.toFixed(5)}`"></p>
      </div>

      <div class="space-y-2 bg-gray-950 p-3.5 rounded-xl border border-gray-800">
        <label class="text-xs font-bold text-green-400">🏠 SUA CASA (Término da Rota)</label>
        <button @click="capturarLocalizacao('casa')" class="w-full bg-gray-800 hover:bg-gray-700 text-xs py-2.5 rounded-lg font-bold text-green-400 border border-gray-700">
          📍 Gravar Minha Localização Atual como Casa
        </button>
        <p x-show="casa.lat" class="text-[10px] text-gray-400 font-mono" x-text="`Lat: ${casa.lat.toFixed(5)}, Lng: ${casa.lng.toFixed(5)}`"></p>
      </div>

      <button @click="salvarLocais()" class="w-full bg-orange-600 text-white font-bold py-3 rounded-xl text-xs">
        Salvar Coordenadas
      </button>
    </div>
  </div>

  <script>
    function entregaApp() {
      return {
        modo: 'rua',
        modalImportar: false,
        modalCD: false,
        cd: JSON.parse(localStorage.getItem('local_cd') || '{"lat":-24.1667,"lng":-46.7800}'),
        casa: JSON.parse(localStorage.getItem('local_casa') || '{"lat":-24.1739,"lng":-46.7816}'),
        pacotesExtraidos: [],
        carregandoProcesso: false,
        entregas: [],
        rotasHistorico: [],
        rotaAtivaId: null,

        DIRECTUS_URL: 'https://banco.studiotesta.com.br',
        N8N_WEBHOOK_URL: 'https://n8n.studiotesta.com.br/webhook/importar-shopee',

        async init() {
          await this.carregarUltimaRota();
        },

        // Processador Nativo de XLSX com SheetJS (Lê direto no celular em milissegundos)
        processarArquivoExcel(event) {
          const file = event.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const data = new Uint8Array(e.target.result);
              const workbook = XLSX.read(data, { type: 'array' });
              const sheetName = workbook.SheetNames[0];
              const worksheet = workbook.Sheets[sheetName];
              const jsonRows = XLSX.utils.sheet_to_json(worksheet);

              if (jsonRows.length === 0) {
                alert('A planilha está vazia!');
                return;
              }

              // Mapeia as colunas oficiais do romaneio da Shopee
              this.pacotesExtraidos = jsonRows.map((row, idx) => {
                const tn = row['SPX TN'] || row['Tracking Number'] || `SPX-${idx+1}`;
                const addr = row['Destination Address'] || row['Address'] || '';
                const stop = row['Stop'] && row['Stop'] !== '-' ? row['Stop'] : (idx + 1);
                const lat = parseFloat(row['Latitude'] || 0);
                const lng = parseFloat(row['Longitude'] || 0);

                let numero = 'S/N';
                const numMatch = addr.match(/,\s*(\d+|S\/?N)/i);
                if (numMatch) numero = numMatch[1];

                return {
                  codigo_rastreio: String(tn).trim(),
                  destinatario: `Parada #${stop}`,
                  telefone: '13999999999',
                  endereco: addr,
                  numero: numero,
                  bairro: String(row['Bairro'] || '').trim(),
                  cidade: String(row['City'] || 'Itanhaém').trim(),
                  cep: String(row['Zipcode/Postal code'] || row['CEP'] || '').trim(),
                  latitude: lat,
                  longitude: lng,
                  stop_shopee: stop
                };
              }).filter(p => p.latitude !== 0 && p.longitude !== 0);

            } catch (err) {
              alert('Erro ao ler planilha: ' + err.message);
            }
          };
          reader.readAsArrayBuffer(file);
        },

        async carregarUltimaRota() {
          try {
            const resRota = await fetch(`${this.DIRECTUS_URL}/items/rotas?sort=-id&limit=1`);
            const dataRota = await resRota.json();
            if (dataRota.data && dataRota.data.length > 0) {
              this.rotaAtivaId = dataRota.data[0].id;
              // Carrega até 300 entregas da rota ativa
              const res = await fetch(`${this.DIRECTUS_URL}/items/entregas?filter[rota_id][_eq]=${this.rotaAtivaId}&sort=ordem_entrega&limit=300`);
              const data = await res.json();
              this.entregas = data.data || [];
            }
          } catch(e) {
            console.error('Erro ao carregar rota:', e);
          }
        },

        async abrirHistorico() {
          this.modo = 'historico';
          const res = await fetch(`${this.DIRECTUS_URL}/items/rotas?sort=-id&limit=30`);
          const data = await res.json();
          this.rotasHistorico = data.data || [];
        },

        async selecionarRotaHistorico(rotaId) {
          this.rotaAtivaId = rotaId;
          const res = await fetch(`${this.DIRECTUS_URL}/items/entregas?filter[rota_id][_eq]=${rotaId}&sort=ordem_entrega&limit=300`);
          const data = await res.json();
          this.entregas = data.data || [];
          this.modo = 'carregamento';
        },

        capturarLocalizacao(tipo) {
          if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
              this[tipo].lat = pos.coords.latitude;
              this[tipo].lng = pos.coords.longitude;
              alert(`GPS de ${tipo.toUpperCase()} capturado com precisão!`);
            }, err => alert('Erro GPS: ' + err.message));
          }
        },

        salvarLocais() {
          localStorage.setItem('local_cd', JSON.stringify(this.cd));
          localStorage.setItem('local_casa', JSON.stringify(this.casa));
          this.modalCD = false;
        },

        get pendentes() {
          return this.entregas.filter(e => !e.status || e.status === 'pendente');
        },

        get entregaAtual() {
          return this.pendentes[0] || null;
        },

        // Agrupamento: Identifica pacotes com mesmo endereço ou coordenadas
        get pacotesMesmoLocal() {
          if (!this.entregaAtual) return [];
          const cur = this.entregaAtual;
          return this.pendentes.filter(e => 
            (e.latitude === cur.latitude && e.longitude === cur.longitude) ||
            (e.endereco === cur.endereco && e.numero === cur.numero)
          );
        },

        async concluirEntrega(entrega) {
          // Se houver mais de um pacote no mesmo local, pergunta se quer marcar todos
          const mesmoLocal = this.pacotesMesmoLocal;
          if (mesmoLocal.length > 1) {
            const conf = confirm(`Há ${mesmoLocal.length} pacotes neste endereço. Deseja marcar TODOS como entregues de uma vez?`);
            if (conf) {
              for (const p of mesmoLocal) {
                await this.atualizarStatus(p.id, 'entregue');
              }
              return;
            }
          }
          await this.atualizarStatus(entrega.id, 'entregue');
        },

        async atualizarStatus(id, novoStatus) {
          const idx = this.entregas.findIndex(e => e.id === id);
          if (idx !== -1) this.entregas[idx].status = novoStatus;

          await fetch(`${this.DIRECTUS_URL}/items/entregas/${id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: novoStatus })
          });
        },

        async enviarParaN8N() {
          this.carregandoProcesso = true;
          try {
            const payload = {
              entregas: this.pacotesExtraidos,
              cd_lat: this.cd.lat,
              cd_lng: this.cd.lng,
              casa_lat: this.casa.lat,
              casa_lng: this.casa.lng
            };

            const res = await fetch(this.N8N_WEBHOOK_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (res.ok) {
              this.modalImportar = false;
              this.pacotesExtraidos = [];
              await this.carregarUltimaRota();
              this.modo = 'carregamento';
            } else {
              alert('Erro no n8n.');
            }
          } catch(e) {
            alert('Falha: ' + e.message);
          } finally {
            this.carregandoProcesso = false;
          }
        }
      }
    }
  </script>
