<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DriveXPS StudioTesta</title>
  <meta name="theme-color" content="#FF5722">
  <link rel="manifest" href="/manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-900 text-white font-sans pb-24" x-data="entregaApp()">

  <!-- Cabeçalho -->
  <header class="bg-orange-600 p-4 sticky top-0 z-40 shadow-md flex justify-between items-center">
    <div>
      <h1 class="font-black text-lg">DriveXPS <span class="text-xs bg-black px-2 py-0.5 rounded">Shopee</span></h1>
      <p class="text-xs opacity-80" x-text="`Restantes: ${pendentes.length} de ${entregas.length}`"></p>
    </div>
    <div class="flex items-center gap-1.5">
      <button @click="modalCD = true" class="bg-orange-800 hover:bg-orange-700 text-white px-2.5 py-1.5 text-xs font-bold rounded-lg border border-orange-400/40">
        🏭 CD & Casa
      </button>
      <button @click="modalImportar = true" class="bg-white text-orange-600 px-3 py-1.5 text-xs font-black rounded-lg shadow">
        + Rota
      </button>
      <button @click="modo = 'carregamento'" :class="modo === 'carregamento' ? 'bg-black text-white' : 'bg-orange-700'" class="px-2.5 py-1.5 text-xs font-bold rounded-lg">📦 Carga</button>
      <button @click="modo = 'rua'" :class="modo === 'rua' ? 'bg-black text-white' : 'bg-orange-700'" class="px-2.5 py-1.5 text-xs font-bold rounded-lg">🚗 Rua</button>
    </div>
  </header>

  <!-- Status CD / Casa -->
  <div class="bg-gray-800/80 px-4 py-2 border-b border-gray-700 flex justify-between text-[11px] text-gray-300">
    <span x-text="`🏭 CD: ${cd.nome || 'Não definido'}`" :class="cd.lat ? 'text-green-400' : 'text-yellow-400'"></span>
    <span x-text="`🏠 Casa: ${casa.nome || 'Não definida'}`" :class="casa.lat ? 'text-green-400' : 'text-yellow-400'"></span>
  </div>

  <!-- MODAL: DEFINIR CD E CASA -->
  <div x-show="modalCD" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4" x-cloak>
    <div class="bg-gray-800 rounded-2xl w-full max-w-md border border-gray-700 p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-gray-700 pb-3">
        <h2 class="font-black text-base text-orange-500">PONTOS DE PARTIDA E CHEGADA</h2>
        <button @click="modalCD = false" class="text-gray-400 text-2xl">&times;</button>
      </div>

      <!-- CD SAÍDA -->
      <div class="space-y-2 bg-gray-900/60 p-3 rounded-xl border border-gray-700">
        <label class="text-xs font-bold text-orange-400">🏭 CD - PONTO DE PARTIDA (Saída)</label>
        <p class="text-[11px] text-gray-400">A rota começará pelo pacote mais próximo daqui.</p>
        <input type="text" x-model="cd.nome" placeholder="Nome do CD (ex: CD Shopee PG)" class="w-full bg-gray-800 border border-gray-600 rounded p-2 text-xs text-white">
        <div class="flex gap-2">
          <button @click="capturarLocalizacao('cd')" class="flex-1 bg-gray-700 hover:bg-gray-600 text-xs py-2 rounded font-bold text-green-400">
            📍 Usar GPS Atual
          </button>
        </div>
        <p x-show="cd.lat" class="text-[10px] text-gray-500" x-text="`Coords: ${cd.lat.toFixed(4)}, ${cd.lng.toFixed(4)}`"></p>
      </div>

      <!-- CASA CHEGADA -->
      <div class="space-y-2 bg-gray-900/60 p-3 rounded-xl border border-gray-700">
        <label class="text-xs font-bold text-green-400">🏠 CASA - PONTO FINAL (Chegada)</label>
        <p class="text-[11px] text-gray-400">A última entrega será o pacote mais perto da sua casa.</p>
        <input type="text" x-model="casa.nome" placeholder="Nome (ex: Minha Casa)" class="w-full bg-gray-800 border border-gray-600 rounded p-2 text-xs text-white">
        <div class="flex gap-2">
          <button @click="capturarLocalizacao('casa')" class="flex-1 bg-gray-700 hover:bg-gray-600 text-xs py-2 rounded font-bold text-green-400">
            📍 Usar GPS Atual
          </button>
        </div>
        <p x-show="casa.lat" class="text-[10px] text-gray-500" x-text="`Coords: ${casa.lat.toFixed(4)}, ${casa.lng.toFixed(4)}`"></p>
      </div>

      <button @click="salvarLocais()" class="w-full bg-orange-600 text-white font-bold py-2.5 rounded-xl text-xs">
        Salvar Configuração
      </button>
    </div>
  </div>

  <!-- MODAL DE IMPORTAÇÃO -->
  <div x-show="modalImportar" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4" x-cloak>
    <div class="bg-gray-800 rounded-2xl w-full max-w-lg border border-gray-700 p-5 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-gray-700 pb-3">
        <div>
          <h2 class="font-black text-lg text-orange-500">MANDA SUAS PARADAS</h2>
          <p class="text-xs text-gray-400">Importação com Otimização pelo CD</p>
        </div>
        <button @click="modalImportar = false" class="text-gray-400 text-2xl">&times;</button>
      </div>

      <div class="space-y-2 bg-gray-900/60 p-3 rounded-xl border border-gray-700/60">
        <label class="text-xs font-bold text-gray-300">Cidade de Entrega (Trava de Região):</label>
        <input type="text" x-model="cidadePadrao" placeholder="Ex: Mongaguá, SP" class="w-full bg-gray-800 border border-gray-600 rounded p-2 text-sm text-white">
      </div>

      <div class="flex border-b border-gray-700 text-sm font-bold">
        <button @click="tipoEnvio = 'prints'" :class="tipoEnvio === 'prints' ? 'border-b-2 border-orange-500 text-orange-400' : 'text-gray-400'" class="flex-1 py-2 text-center">
          📸 Prints / Fotos
        </button>
        <button @click="tipoEnvio = 'texto'" :class="tipoEnvio === 'texto' ? 'border-b-2 border-orange-500 text-orange-400' : 'text-gray-400'" class="flex-1 py-2 text-center">
          📄 Colar Texto
        </button>
      </div>

      <div x-show="tipoEnvio === 'prints'" class="space-y-3">
        <label class="block border-2 border-dashed border-gray-600 rounded-xl p-6 text-center cursor-pointer hover:border-orange-500">
          <span class="text-3xl block mb-2">📸</span>
          <span class="text-sm font-bold block text-gray-200">Selecionar Prints do SPX Driver</span>
          <span class="text-xs text-gray-400 block mt-1">Pode selecionar múltiplos prints</span>
          <input type="file" multiple accept="image/*" @change="arquivosFotos = $event.target.files" class="hidden">
        </label>
        <p x-show="arquivosFotos.length > 0" class="text-xs text-green-400 font-bold text-center" x-text="`${arquivosFotos.length} imagem(ns) selecionada(s)`"></p>
      </div>

      <div x-show="tipoEnvio === 'texto'" class="space-y-2">
        <textarea x-model="textoRomaneio" rows="6" placeholder="Cole aqui o texto dos pacotes..." class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-xs text-white font-mono"></textarea>
      </div>

      <button @click="enviarParaN8N()" :disabled="carregandoProcesso" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-black py-3.5 rounded-xl text-sm flex items-center justify-center gap-2 shadow-lg disabled:opacity-50">
        <span x-show="!carregandoProcesso">🚀 Otimizar Rota Partindo do CD</span>
        <span x-show="carregandoProcesso">⏳ Lendo com Gemini e Calculando Rota...</span>
      </button>
    </div>
  </div>

  <!-- MODO 1: CARREGAMENTO -->
  <main x-show="modo === 'carregamento'" class="p-4 space-y-3">
    <template x-for="item in entregas" :key="item.id">
      <div class="bg-gray-800 p-3 rounded-lg flex items-center justify-between border-l-4"
           :class="{
             'opacity-40 line-through bg-gray-950 border-gray-600': item.status === 'entregue',
             'border-green-500': item.status !== 'entregue' && item.setor_uno === 'FRENTE',
             'border-blue-500': item.status !== 'entregue' && item.setor_uno === 'BANCO_TRAS',
             'border-purple-500': item.status !== 'entregue' && item.setor_uno === 'MALA_FRENTE',
             'border-red-500': item.status !== 'entregue' && item.setor_uno === 'MALA_FUNDO'
           }">
        <div class="flex items-center gap-3">
          <span class="text-2xl font-black bg-gray-700 px-2.5 py-1 rounded" x-text="`#${item.ordem_entrega}`"></span>
          <div>
            <p class="font-bold text-sm" x-text="item.destinatario"></p>
            <p class="text-xs text-gray-400" x-text="`${item.endereco}, ${item.numero}`"></p>
            <p class="text-[10px] text-gray-500" x-text="item.codigo_rastreio"></p>
          </div>
        </div>
        <div class="text-right">
          <span x-show="item.status === 'entregue'" class="text-xs font-black text-green-400">ENTREGUE</span>
          <span x-show="item.status !== 'entregue'" class="text-[10px] font-bold px-2 py-1 rounded uppercase tracking-wider bg-gray-700 text-gray-300" x-text="(item.setor_uno || 'FRENTE').replace('_', ' ')"></span>
        </div>
      </div>
    </template>
  </main>

  <!-- MODO 2: RUA -->
  <main x-show="modo === 'rua'" class="p-4">
    <template x-if="entregaAtual">
      <div class="bg-gray-800 rounded-xl p-5 border border-gray-700 space-y-4 shadow-xl">
        <div class="flex justify-between items-center border-b border-gray-700 pb-3">
          <div class="flex items-center gap-2">
            <span class="bg-orange-600 text-white font-black text-xl px-3 py-1 rounded-lg" x-text="`#${entregaAtual.ordem_entrega}`"></span>
            <span class="text-xs text-gray-400 uppercase font-bold" x-text="`Setor: ${entregaAtual.setor_uno || 'GERAL'}`"></span>
          </div>
          <span class="text-xs bg-yellow-500/20 text-yellow-400 font-bold px-2 py-1 rounded" x-text="entregaAtual.codigo_rastreio"></span>
        </div>

        <div>
          <h2 class="text-xl font-black text-white" x-text="entregaAtual.destinatario"></h2>
          <p class="text-base text-gray-300 font-medium" x-text="`${entregaAtual.endereco}, ${entregaAtual.numero}`"></p>
          <p class="text-sm text-gray-400" x-text="`${entregaAtual.bairro || ''} - ${entregaAtual.cidade || ''}`"></p>
        </div>

        <div class="grid grid-cols-3 gap-2 pt-2">
          <a :href="`waze://?ll=${entregaAtual.latitude},${entregaAtual.longitude}&navigate=yes`" class="bg-blue-600 text-center py-3 rounded-lg font-bold text-sm flex items-center justify-center">🚗 Waze</a>
          <a :href="`google.navigation:q=${entregaAtual.latitude},${entregaAtual.longitude}`" class="bg-emerald-600 text-center py-3 rounded-lg font-bold text-sm flex items-center justify-center">🗺️ Maps</a>
          <a :href="`https://wa.me/55${entregaAtual.telefone}?text=Olá! Sou o entregador da Shopee.`" class="bg-green-600 text-center py-3 rounded-lg font-bold text-sm flex items-center justify-center">💬 Whats</a>
        </div>

        <div class="grid grid-cols-2 gap-3 pt-3 border-t border-gray-700">
          <button @click="atualizarStatus(entregaAtual.id, 'ausente')" class="bg-gray-700 text-yellow-400 py-3.5 rounded-lg font-bold text-sm">⚠️ Ausente / Pular</button>
          <button @click="atualizarStatus(entregaAtual.id, 'entregue')" class="bg-orange-600 text-white py-3.5 rounded-lg font-black text-base shadow-lg">✅ Entregue</button>
        </div>
      </div>
    </template>
  </main>

  <script>
    function entregaApp() {
      return {
        modo: 'rua',
        modalImportar: false,
        modalCD: false,
        tipoEnvio: 'prints',
        cidadePadrao: localStorage.getItem('cidade_padrao') || 'Mongaguá, SP',
        cd: JSON.parse(localStorage.getItem('local_cd') || '{"nome":"CD Shopee","lat":-24.1085,"lng":-46.6432}'),
        casa: JSON.parse(localStorage.getItem('local_casa') || '{"nome":"Minha Casa","lat":-24.0915,"lng":-46.6190}'),
        textoRomaneio: '',
        arquivosFotos: [],
        carregandoProcesso: false,
        entregas: [],
        DIRECTUS_URL: 'https://banco.studiotesta.com.br',
        N8N_WEBHOOK_URL: 'https://n8n.studiotesta.com.br/webhook/importar-shopee',

        async init() {
          this.carregarEntregas();
        },

        capturarLocalizacao(tipo) {
          if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
              this[tipo].lat = pos.coords.latitude;
              this[tipo].lng = pos.coords.longitude;
              alert(`Coordenadas de ${tipo.toUpperCase()} capturadas!`);
            }, err => alert('Erro no GPS: ' + err.message));
          }
        },

        salvarLocais() {
          localStorage.setItem('local_cd', JSON.stringify(this.cd));
          localStorage.setItem('local_casa', JSON.stringify(this.casa));
          this.modalCD = false;
        },

        async carregarEntregas() {
          const res = await fetch(`${this.DIRECTUS_URL}/items/entregas?sort=ordem_entrega`);
          if (res.ok) {
            const data = await res.json();
            this.entregas = data.data || [];
          }
        },

        get pendentes() {
          return this.entregas.filter(e => !e.status || e.status === 'pendente');
        },

        get entregaAtual() {
          return this.pendentes[0] || null;
        },

        async atualizarStatus(id, novoStatus) {
          const idx = this.entregas.findIndex(e => e.id === id);
          if (idx !== -1) this.entregas[idx].status = novoStatus;

          await fetch(`${this.DIRECTUS_URL}/items/entregas/${id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: novoStatus })
          });
        },

        async enviarParaN8N() {
          this.carregandoProcesso = true;
          localStorage.setItem('cidade_padrao', this.cidadePadrao);

          const formData = new FormData();
          formData.append('cidade', this.cidadePadrao);
          formData.append('cd_lat', this.cd.lat);
          formData.append('cd_lng', this.cd.lng);
          formData.append('casa_lat', this.casa.lat);
          formData.append('casa_lng', this.casa.lng);

          if (this.tipoEnvio === 'texto') {
            formData.append('texto', this.textoRomaneio);
          } else {
            for (let i = 0; i < this.arquivosFotos.length; i++) {
              formData.append('arquivos', this.arquivosFotos[i]);
            }
          }

          try {
            const res = await fetch(this.N8N_WEBHOOK_URL, { method: 'POST', body: formData });
            if (res.ok) {
              this.modalImportar = false;
              this.arquivosFotos = [];
              await this.carregarEntregas();
              this.modo = 'carregamento';
            } else {
              alert('Erro no n8n.');
            }
          } catch (e) {
            alert('Erro: ' + e.message);
          } finally {
            this.carregandoProcesso = false;
          }
        }
      }
    }
  </script>
</body>
</html>
