<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DriveXPS StudioTesta</title>
  <meta name="theme-color" content="#FF5722">
  <link rel="manifest" href="/manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-900 text-white font-sans pb-20" x-data="entregaApp()">

  <!-- Cabeçalho -->
  <header class="bg-orange-600 p-4 sticky top-0 z-50 flex justify-between items-center shadow-md">
    <div>
      <h1 class="font-black text-lg">DriveXPS <span class="text-xs bg-black px-2 py-0.5 rounded">Shopee</span></h1>
      <p class="text-xs opacity-80" x-text="`Restantes: ${pendentes.length} de ${entregas.length}`"></p>
    </div>
    <div class="flex gap-2">
      <button @click="modo = 'carregamento'" :class="modo === 'carregamento' ? 'bg-black text-white' : 'bg-orange-700'" class="px-3 py-1 text-xs font-bold rounded">📦 Carga</button>
      <button @click="modo = 'rua'" :class="modo === 'rua' ? 'bg-black text-white' : 'bg-orange-700'" class="px-3 py-1 text-xs font-bold rounded">🚗 Rua</button>
    </div>
  </header>

  <!-- Banner de Erro/Diagnóstico (Só aparece se o Directus falhar) -->
  <div x-show="erroMsg" class="bg-red-600 p-3 text-sm text-center font-bold" x-text="erroMsg"></div>

  <!-- MODO 1: CARREGAMENTO (Canetão & Organização no Uno) -->
  <main x-show="modo === 'carregamento'" class="p-4 space-y-3">
    <div class="bg-gray-800 p-3 rounded-lg border border-gray-700 text-xs text-yellow-400">
      ✍️ <strong>Regra do Canetão:</strong> Escreva o número grande no pacote e coloque no setor indicado antes de sair do CDD.
    </div>

    <template x-for="item in entregas" :key="item.id">
      <div class="bg-gray-800 p-3 rounded-lg flex items-center justify-between border-l-4"
           :class="{
             'border-green-500': item.setor_uno === 'FRENTE',
             'border-blue-500': item.setor_uno === 'BANCO_TRAS',
             'border-purple-500': item.setor_uno === 'MALA_FRENTE',
             'border-red-500': item.setor_uno === 'MALA_FUNDO'
           }">
        <div class="flex items-center gap-3">
          <span class="text-2xl font-black bg-gray-700 px-2.5 py-1 rounded" x-text="`#${item.ordem_entrega}`"></span>
          <div>
            <p class="font-bold text-sm" x-text="item.destinatario"></p>
            <p class="text-xs text-gray-400" x-text="`${item.endereco}, ${item.numero}`"></p>
            <p class="text-[10px] text-gray-500" x-text="item.codigo_rastreio"></p>
          </div>
        </div>
        <div class="text-right">
          <span class="text-[10px] font-bold px-2 py-1 rounded uppercase tracking-wider"
                :class="{
                  'bg-green-900 text-green-300': item.setor_uno === 'FRENTE',
                  'bg-blue-900 text-blue-300': item.setor_uno === 'BANCO_TRAS',
                  'bg-purple-900 text-purple-300': item.setor_uno === 'MALA_FRENTE',
                  'bg-red-900 text-red-300': item.setor_uno === 'MALA_FUNDO'
                }" x-text="(item.setor_uno || 'GERAL').replace('_', ' ')"></span>
        </div>
      </div>
    </template>
  </main>

  <!-- MODO 2: RUA (Cockpit de Navegação Rápida) -->
  <main x-show="modo === 'rua'" class="p-4">
    <template x-if="entregaAtual">
      <div class="bg-gray-800 rounded-xl p-5 border border-gray-700 space-y-4 shadow-xl">
        <!-- Indicador de Posição -->
        <div class="flex justify-between items-center border-b border-gray-700 pb-3">
          <div class="flex items-center gap-2">
            <span class="bg-orange-600 text-white font-black text-xl px-3 py-1 rounded-lg" x-text="`#${entregaAtual.ordem_entrega}`"></span>
            <span class="text-xs text-gray-400 uppercase font-bold" x-text="`Setor: ${entregaAtual.setor_uno || 'GERAL'}`"></span>
          </div>
          <span class="text-xs bg-yellow-500/20 text-yellow-400 font-bold px-2 py-1 rounded" x-text="entregaAtual.codigo_rastreio"></span>
        </div>

        <!-- Dados do Destinatário -->
        <div>
          <h2 class="text-xl font-black text-white" x-text="entregaAtual.destinatario"></h2>
          <p class="text-base text-gray-300 font-medium" x-text="`${entregaAtual.endereco}, ${entregaAtual.numero}`"></p>
          <p class="text-sm text-gray-400" x-text="`${entregaAtual.bairro || ''} - ${entregaAtual.cidade || ''}`"></p>
        </div>

        <!-- Botões de Ação Externa (Waze, Maps, Whats) -->
        <div class="grid grid-cols-3 gap-2 pt-2">
          <a :href="`waze://?ll=${entregaAtual.latitude},${entregaAtual.longitude}&navigate=yes`" 
             class="bg-blue-600 hover:bg-blue-700 text-center py-3 rounded-lg font-bold text-sm flex flex-col items-center justify-center">
            🚗 Waze
          </a>
          <a :href="`google.navigation:q=${entregaAtual.latitude},${entregaAtual.longitude}`" 
             class="bg-emerald-600 hover:bg-emerald-700 text-center py-3 rounded-lg font-bold text-sm flex flex-col items-center justify-center">
            🗺️ Maps
          </a>
          <a :href="`https://wa.me/55${entregaAtual.telefone}?text=Olá! Sou o entregador da Shopee e estou chegando com a sua encomenda.`" 
             class="bg-green-600 hover:bg-green-700 text-center py-3 rounded-lg font-bold text-sm flex flex-col items-center justify-center">
            💬 Whats
          </a>
        </div>

        <!-- Status de Conclusão -->
        <div class="grid grid-cols-2 gap-3 pt-3 border-t border-gray-700">
          <button @click="atualizarStatus(entregaAtual.id, 'ausente')" class="bg-gray-700 hover:bg-gray-600 text-yellow-400 py-3.5 rounded-lg font-bold text-sm">
            ⚠️ Ausente / Pular
          </button>
          <button @click="atualizarStatus(entregaAtual.id, 'entregue')" class="bg-orange-600 hover:bg-orange-500 text-white py-3.5 rounded-lg font-black text-base shadow-lg shadow-orange-600/30">
            ✅ Entregue
          </button>
        </div>
      </div>
    </template>

    <template x-if="!entregaAtual && !erroMsg">
      <div class="text-center py-16 space-y-3">
        <span class="text-5xl">🎉</span>
        <h2 class="text-2xl font-bold">Rota Finalizada!</h2>
        <p class="text-gray-400 text-sm">Todos os pacotes foram processados com sucesso.</p>
      </div>
    </template>
  </main>

  <script>
    function entregaApp() {
      return {
        modo: 'carregamento', // Inicia no modo carga para conferência
        entregas: [],
        erroMsg: null,
        DIRECTUS_URL: 'https://banco.studiotesta.com.br', // Sem barra no final!

        async init() {
          try {
            // Busca entregas sem filtro restritivo de início
            const res = await fetch(`${this.DIRECTUS_URL}/items/entregas?sort=ordem_entrega`);
            
            if (!res.ok) {
              if (res.status === 403) {
                this.erroMsg = 'Erro 403 (Permissão): Vá no Directus > Roles > Public e libere a leitura de "entregas".';
              } else if (res.status === 404) {
                this.erroMsg = 'Erro 404: Coleção "entregas" não encontrada na API.';
              } else {
                this.erroMsg = `Erro ${res.status} ao conectar com Directus.`;
              }
              return;
            }

            const data = await res.json();
            this.entregas = data.data || [];
            
            if (this.entregas.length === 0) {
              this.erroMsg = 'Conexão OK, mas a tabela entregas retornou 0 itens.';
            }
          } catch (err) {
            this.erroMsg = `Erro de Conexão ou CORS: O navegador bloqueou o acesso ao Directus. (${err.message})`;
          }
        },

        get pendentes() {
          return this.entregas.filter(e => !e.status || e.status === 'pendente');
        },

        get entregaAtual() {
          return this.pendentes[0] || null;
        },

        async atualizarStatus(id, novoStatus) {
          const idx = this.entregas.findIndex(e => e.id === id);
          if (idx !== -1) this.entregas[idx].status = novoStatus;

          try {
            await fetch(`${this.DIRECTUS_URL}/items/entregas/${id}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ status: novoStatus })
            });
          } catch (e) {
            console.error('Falha ao sincronizar status:', e);
          }
        }
      }
    }
  </script>
</body>
</html>
