<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DriveXPS StudioTesta</title>
  <meta name="theme-color" content="#FF5722">
  <link rel="manifest" href="/manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-900 text-white font-sans pb-24" x-data="entregaApp()">

  <!-- Cabeçalho -->
  <header class="bg-orange-600 p-4 sticky top-0 z-40 shadow-md flex justify-between items-center">
    <div>
      <h1 class="font-black text-lg">DriveXPS <span class="text-xs bg-black px-2 py-0.5 rounded" x-text="`Rota #${rotaAtivaId || '...'}`"></span></h1>
      <p class="text-xs opacity-80" x-text="`Restantes: ${pendentes.length} de ${entregas.length}`"></p>
    </div>
    <div class="flex items-center gap-1.5">
      <button @click="modalCD = true" class="bg-orange-800 hover:bg-orange-700 text-white px-2 py-1.5 text-xs font-bold rounded-lg border border-orange-400/30">
        🏭 CD
      </button>
      <button @click="modalImportar = true" class="bg-white text-orange-600 px-2.5 py-1.5 text-xs font-black rounded-lg shadow">
        + Rota
      </button>
      <button @click="modo = 'carregamento'" :class="modo === 'carregamento' ? 'bg-black text-white' : 'bg-orange-700'" class="px-2 py-1.5 text-xs font-bold rounded-lg">📦 Carga</button>
      <button @click="modo = 'rua'" :class="modo === 'rua' ? 'bg-black text-white' : 'bg-orange-700'" class="px-2 py-1.5 text-xs font-bold rounded-lg">🚗 Rua</button>
      <button @click="abrirHistorico()" :class="modo === 'historico' ? 'bg-black text-white' : 'bg-orange-700'" class="px-2 py-1.5 text-xs font-bold rounded-lg">📜 Histórico</button>
    </div>
  </header>

  <!-- MODO 1: CARREGAMENTO (Apenas rota ativa) -->
  <main x-show="modo === 'carregamento'" class="p-4 space-y-3">
    <div class="bg-gray-800 p-3 rounded-lg border border-gray-700 text-xs text-yellow-400 flex justify-between items-center">
      <span>✍️ <strong>Regra do Canetão:</strong> Marque o número no pacote antes de sair do CD.</span>
    </div>

    <template x-for="item in entregas" :key="item.id">
      <div class="bg-gray-800 p-3 rounded-lg flex items-center justify-between border-l-4"
           :class="{
             'opacity-30 line-through bg-gray-950 border-gray-600': item.status === 'entregue',
             'border-green-500': item.status !== 'entregue' && item.setor_uno === 'FRENTE',
             'border-blue-500': item.status !== 'entregue' && item.setor_uno === 'BANCO_TRAS',
             'border-purple-500': item.status !== 'entregue' && item.setor_uno === 'MALA_FRENTE',
             'border-red-500': item.status !== 'entregue' && item.setor_uno === 'MALA_FUNDO'
           }">
        <div class="flex items-center gap-3">
          <span class="text-2xl font-black bg-gray-700 px-2.5 py-1 rounded" x-text="`#${item.ordem_entrega}`"></span>
          <div>
            <p class="font-bold text-sm" x-text="item.destinatario"></p>
            <p class="text-xs text-gray-400" x-text="`${item.endereco}, ${item.numero}`"></p>
            <p class="text-[10px] text-gray-500" x-text="item.codigo_rastreio"></p>
          </div>
        </div>
        <div class="text-right">
          <span x-show="item.status === 'entregue'" class="text-xs font-black text-green-400">ENTREGUE</span>
          <span x-show="item.status !== 'entregue'" class="text-[10px] font-bold px-2 py-1 rounded uppercase tracking-wider bg-gray-700 text-gray-300" x-text="(item.setor_uno || 'FRENTE').replace('_', ' ')"></span>
        </div>
      </div>
    </template>
  </main>

  <!-- MODO 2: RUA (Apenas parada atual) -->
  <main x-show="modo === 'rua'" class="p-4">
    <template x-if="entregaAtual">
      <div class="bg-gray-800 rounded-xl p-5 border border-gray-700 space-y-4 shadow-xl">
        <div class="flex justify-between items-center border-b border-gray-700 pb-3">
          <div class="flex items-center gap-2">
            <span class="bg-orange-600 text-white font-black text-xl px-3 py-1 rounded-lg" x-text="`#${entregaAtual.ordem_entrega}`"></span>
            <span class="text-xs text-gray-400 uppercase font-bold" x-text="`Setor: ${entregaAtual.setor_uno || 'GERAL'}`"></span>
          </div>
          <span class="text-xs bg-yellow-500/20 text-yellow-400 font-bold px-2 py-1 rounded" x-text="entregaAtual.codigo_rastreio"></span>
        </div>

        <div>
          <h2 class="text-xl font-black text-white" x-text="entregaAtual.destinatario"></h2>
          <p class="text-base text-gray-300 font-medium" x-text="`${entregaAtual.endereco}, ${entregaAtual.numero}`"></p>
          <p class="text-sm text-gray-400" x-text="`${entregaAtual.bairro || ''} - ${entregaAtual.cidade || ''}`"></p>
        </div>

        <div class="grid grid-cols-3 gap-2 pt-2">
          <a :href="`waze://?ll=${entregaAtual.latitude},${entregaAtual.longitude}&navigate=yes`" class="bg-blue-600 text-center py-3 rounded-lg font-bold text-sm flex items-center justify-center">🚗 Waze</a>
          <a :href="`google.navigation:q=${entregaAtual.latitude},${entregaAtual.longitude}`" class="bg-emerald-600 text-center py-3 rounded-lg font-bold text-sm flex items-center justify-center">🗺️ Maps</a>
          <a :href="`https://wa.me/55${entregaAtual.telefone}?text=Olá! Sou o entregador da Shopee.`" class="bg-green-600 text-center py-3 rounded-lg font-bold text-sm flex items-center justify-center">💬 Whats</a>
        </div>

        <div class="grid grid-cols-2 gap-3 pt-3 border-t border-gray-700">
          <button @click="atualizarStatus(entregaAtual.id, 'ausente')" class="bg-gray-700 text-yellow-400 py-3.5 rounded-lg font-bold text-sm">⚠️ Ausente / Pular</button>
          <button @click="atualizarStatus(entregaAtual.id, 'entregue')" class="bg-orange-600 text-white py-3.5 rounded-lg font-black text-base shadow-lg">✅ Entregue</button>
        </div>
      </div>
    </template>

    <template x-if="!entregaAtual && entregas.length > 0">
      <div class="text-center py-16 space-y-3">
        <span class="text-5xl">🎉</span>
        <h2 class="text-2xl font-bold">Rota #${rotaAtivaId} Concluída!</h2>
        <p class="text-gray-400 text-sm">Todos os pacotes de hoje foram processados.</p>
      </div>
    </template>
  </main>

  <!-- MODO 3: HISTÓRICO DE ROTAS (Por Dia e Mês) -->
  <main x-show="modo === 'historico'" class="p-4 space-y-4">
    <h2 class="text-lg font-black text-orange-500">📜 Histórico de Rotas Entregues</h2>
    
    <div class="space-y-3">
      <template x-for="r in rotasHistorico" :key="r.id">
        <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 space-y-2">
          <div class="flex justify-between items-center">
            <div>
              <span class="text-sm font-black text-white" x-text="`Rota #${r.id}`"></span>
              <p class="text-xs text-gray-400" x-text="`Data: ${r.data ? new Date(r.data).toLocaleDateString('pt-BR') : 'Hoje'}`"></p>
            </div>
            <span class="text-xs bg-green-500/20 text-green-400 px-2.5 py-1 rounded-full font-bold" x-text="`${r.total_pacotes || 0} pacotes`"></span>
          </div>
          <button @click="selecionarRotaHistorico(r.id)" class="w-full bg-gray-700 hover:bg-gray-600 text-xs py-2 rounded-lg font-bold text-orange-300">
            Ver Detalhes dos Pacotes
          </button>
        </div>
      </template>
    </div>
  </main>

  <!-- MODAL: DEFINIR CD E CASA -->
  <div x-show="modalCD" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4" x-cloak>
    <div class="bg-gray-800 rounded-2xl w-full max-w-md border border-gray-700 p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-gray-700 pb-3">
        <h2 class="font-black text-base text-orange-500">CONFIGURAR PONTOS GPS</h2>
        <button @click="modalCD = false" class="text-gray-400 text-2xl">&times;</button>
      </div>

      <div class="space-y-2 bg-gray-900/60 p-3 rounded-xl border border-gray-700">
        <label class="text-xs font-bold text-orange-400">🏭 CD - SAÍDA (Ponto de Partida)</label>
        <button @click="capturarLocalizacao('cd')" class="w-full bg-gray-700 hover:bg-gray-600 text-xs py-2.5 rounded font-bold text-green-400">
          📍 Gravar GPS Atual como CD
        </button>
        <p x-show="cd.lat" class="text-[10px] text-gray-400" x-text="`Coords: ${cd.lat}, ${cd.lng}`"></p>
      </div>

      <div class="space-y-2 bg-gray-900/60 p-3 rounded-xl border border-gray-700">
        <label class="text-xs font-bold text-green-400">🏠 CASA - CHEGADA (Ponto Final)</label>
        <button @click="capturarLocalizacao('casa')" class="w-full bg-gray-700 hover:bg-gray-600 text-xs py-2.5 rounded font-bold text-green-400">
          📍 Gravar GPS Atual como Casa
        </button>
        <p x-show="casa.lat" class="text-[10px] text-gray-400" x-text="`Coords: ${casa.lat}, ${casa.lng}`"></p>
      </div>

      <button @click="salvarLocais()" class="w-full bg-orange-600 text-white font-bold py-2.5 rounded-xl text-xs">
        Salvar Coordenadas
      </button>
    </div>
  </div>

  <!-- MODAL: IMPORTAR ROTA -->
  <div x-show="modalImportar" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4" x-cloak>
    <div class="bg-gray-800 rounded-2xl w-full max-w-lg border border-gray-700 p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-gray-700 pb-3">
        <h2 class="font-black text-lg text-orange-500">MANDA SUAS PARADAS</h2>
        <button @click="modalImportar = false" class="text-gray-400 text-2xl">&times;</button>
      </div>

      <div class="space-y-2">
        <label class="text-xs font-bold text-gray-300">Cidade Trava:</label>
        <input type="text" x-model="cidadePadrao" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-xs text-white">
      </div>

      <label class="block border-2 border-dashed border-gray-600 rounded-xl p-6 text-center cursor-pointer hover:border-orange-500">
        <span class="text-3xl block mb-2">📸</span>
        <span class="text-sm font-bold block text-gray-200">Subir Print do SPX</span>
        <input type="file" multiple accept="image/*" @change="arquivosFotos = $event.target.files" class="hidden">
      </label>
      <p x-show="arquivosFotos.length > 0" class="text-xs text-green-400 font-bold text-center" x-text="`${arquivosFotos.length} imagem(ns) selecionada(s)`"></p>

      <button @click="enviarParaN8N()" :disabled="carregandoProcesso" class="w-full bg-orange-600 text-white font-black py-3.5 rounded-xl text-sm flex items-center justify-center gap-2">
        <span x-show="!carregandoProcesso">🚀 Otimizar Rota Partindo do CD</span>
        <span x-show="carregandoProcesso">⏳ Otimizando Trajeto Real...</span>
      </button>
    </div>
  </div>

  <script>
    function entregaApp() {
      return {
        modo: 'rua',
        modalImportar: false,
        modalCD: false,
        cidadePadrao: localStorage.getItem('cidade_padrao') || 'Mongaguá, SP',
        cd: JSON.parse(localStorage.getItem('local_cd') || '{"lat":-24.1085,"lng":-46.6432}'),
        casa: JSON.parse(localStorage.getItem('local_casa') || '{"lat":-24.0915,"lng":-46.6190}'),
        arquivosFotos: [],
        carregandoProcesso: false,
        entregas: [],
        rotasHistorico: [],
        rotaAtivaId: null,
        DIRECTUS_URL: 'https://banco.studiotesta.com.br',
        N8N_WEBHOOK_URL: 'https://n8n.studiotesta.com.br/webhook/importar-shopee',

        async init() {
          await this.carregarUltimaRota();
        },

        async carregarUltimaRota() {
          try {
            // Busca apenas a última rota criada
            const resRota = await fetch(`${this.DIRECTUS_URL}/items/rotas?sort=-id&limit=1`);
            const dataRota = await resRota.json();
            if (dataRota.data && dataRota.data.length > 0) {
              this.rotaAtivaId = dataRota.data[0].id;
              // Carrega somente os pacotes pertencentes a essa rota específica
              const res = await fetch(`${this.DIRECTUS_URL}/items/entregas?filter[rota_id][_eq]=${this.rotaAtivaId}&sort=ordem_entrega`);
              const data = await res.json();
              this.entregas = data.data || [];
            }
          } catch(e) {
            console.error('Erro ao carregar rota:', e);
          }
        },

        async abrirHistorico() {
          this.modo = 'historico';
          const res = await fetch(`${this.DIRECTUS_URL}/items/rotas?sort=-id`);
          const data = await res.json();
          this.rotasHistorico = data.data || [];
        },

        async selecionarRotaHistorico(rotaId) {
          this.rotaAtivaId = rotaId;
          const res = await fetch(`${this.DIRECTUS_URL}/items/entregas?filter[rota_id][_eq]=${rotaId}&sort=ordem_entrega`);
          const data = await res.json();
          this.entregas = data.data || [];
          this.modo = 'carregamento';
        },

        capturarLocalizacao(tipo) {
          if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
              this[tipo].lat = pos.coords.latitude;
              this[tipo].lng = pos.coords.longitude;
              alert(`Coordenadas de ${tipo.toUpperCase()} salvas com precisão!`);
            }, err => alert('Erro GPS: ' + err.message));
          }
        },

        salvarLocais() {
          localStorage.setItem('local_cd', JSON.stringify(this.cd));
          localStorage.setItem('local_casa', JSON.stringify(this.casa));
          this.modalCD = false;
        },

        get pendentes() {
          return this.entregas.filter(e => !e.status || e.status === 'pendente');
        },

        get entregaAtual() {
          return this.pendentes[0] || null;
        },

        async atualizarStatus(id, novoStatus) {
          const idx = this.entregas.findIndex(e => e.id === id);
          if (idx !== -1) this.entregas[idx].status = novoStatus;

          await fetch(`${this.DIRECTUS_URL}/items/entregas/${id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: novoStatus })
          });
        },

        async enviarParaN8N() {
          this.carregandoProcesso = true;
          const formData = new FormData();
          formData.append('cidade', this.cidadePadrao);
          formData.append('cd_lat', this.cd.lat);
          formData.append('cd_lng', this.cd.lng);
          formData.append('casa_lat', this.casa.lat);
          formData.append('casa_lng', this.casa.lng);

          for (let i = 0; i < this.arquivosFotos.length; i++) {
            formData.append('arquivos', this.arquivosFotos[i]);
          }

          try {
            const res = await fetch(this.N8N_WEBHOOK_URL, { method: 'POST', body: formData });
            if (res.ok) {
              this.modalImportar = false;
              this.arquivosFotos = [];
              await this.carregarUltimaRota();
              this.modo = 'carregamento';
            }
          } catch(e) {
            alert('Falha: ' + e.message);
          } finally {
            this.carregandoProcesso = false;
          }
        }
      }
    }
  </script>
</body>
</html>
