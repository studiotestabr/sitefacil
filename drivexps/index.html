<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DriveXPS - Rotas Shopee</title>
  
  <meta name="theme-color" content="#EA580C">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DriveXPS">
  
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <!-- Tailwind, Alpine.js e SheetJS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('ServiceWorker ativo!', reg.scope))
          .catch(err => console.error('Erro no ServiceWorker:', err));
      });
    }
  </script>
</head>
<body class="bg-gray-950 text-white font-sans pb-28 select-none" x-data="entregaApp()">

  <!-- CABEÇALHO REFORMULADO EM 3 LINHAS -->
  <header class="bg-orange-600 px-4 pt-3 pb-3 sticky top-0 z-40 shadow-xl space-y-2.5">
    
    <!-- Linha 1: Nome do App Centralizado -->
    <div class="text-center">
      <h1 class="font-black text-2xl tracking-wider text-white drop-shadow-sm">DriveXPS</h1>
    </div>

    <!-- Linha 2: Rota à esquerda / Pacotes Restantes à direita -->
    <div class="flex justify-between items-center text-xs font-bold px-1 border-t border-orange-500/60 pt-2">
      <div class="flex items-center gap-1.5">
        <span class="bg-black/80 text-orange-400 font-mono px-2.5 py-0.5 rounded text-xs tracking-wider" 
              x-text="rotaAtivaId ? `ROTA #${rotaAtivaId}` : 'SEM ROTA ATIVA'"></span>
      </div>
      <div class="text-orange-100 font-semibold text-xs">
        Restantes: <span class="font-black text-white text-sm" x-text="pendentes.length"></span> de <span x-text="entregas.length"></span>
      </div>
    </div>

    <!-- Linha 3: Grade de 4 Botões Principais -->
    <nav class="grid grid-cols-4 gap-1.5 pt-0.5">
      <button @click="modalImportar = true" 
              class="bg-white hover:bg-orange-50 text-orange-600 font-black py-2 rounded-xl text-xs flex flex-col items-center justify-center shadow-md active:scale-95 transition">
        <span class="text-sm leading-none">+</span>
        <span class="leading-none mt-0.5">Rota</span>
      </button>

      <button @click="modo = 'carregamento'" 
              :class="modo === 'carregamento' ? 'bg-black text-white shadow-inner border border-gray-700' : 'bg-orange-700 text-orange-100'"
              class="font-black py-2 rounded-xl text-xs flex flex-col items-center justify-center active:scale-95 transition">
        <span class="text-sm leading-none">📦</span>
        <span class="leading-none mt-0.5">Sacolas</span>
      </button>

      <button @click="modo = 'rua'" 
              :class="modo === 'rua' ? 'bg-black text-white shadow-inner border border-gray-700' : 'bg-orange-700 text-orange-100'"
              class="font-black py-2 rounded-xl text-xs flex flex-col items-center justify-center active:scale-95 transition">
        <span class="text-sm leading-none">🚗</span>
        <span class="leading-none mt-0.5">Rua</span>
      </button>

      <button @click="abrirHistorico()" 
              :class="modo === 'historico' ? 'bg-black text-white shadow-inner border border-gray-700' : 'bg-orange-700 text-orange-100'"
              class="font-black py-2 rounded-xl text-xs flex flex-col items-center justify-center active:scale-95 transition">
        <span class="text-sm leading-none">📜</span>
        <span class="leading-none mt-0.5">Histórico</span>
      </button>
    </nav>
  </header>

  <!-- BOTÕES DE CONFIGURAÇÃO DE GPS (CD e CASA) -->
  <section class="bg-gray-900/90 px-4 py-2 border-b border-gray-800 grid grid-cols-2 gap-2.5">
    <button @click="modalCD = true" 
            class="bg-gray-800 hover:bg-gray-700 border border-gray-700/80 rounded-xl p-2 flex items-center justify-between text-left active:scale-95 transition shadow-sm">
      <div class="truncate pr-1">
        <span class="text-[10px] text-gray-400 font-bold block uppercase tracking-wider">Ponto Partida:</span>
        <span class="text-xs font-bold text-white truncate block">🏭 CD Saída</span>
      </div>
      <span class="text-[10px] font-black px-2 py-0.5 rounded-full border"
            :class="cd.lat ? 'bg-emerald-950 text-emerald-400 border-emerald-800' : 'bg-yellow-950 text-yellow-400 border-yellow-800'"
            x-text="cd.lat ? 'Configurado' : 'Pendente'"></span>
    </button>

    <button @click="modalCD = true" 
            class="bg-gray-800 hover:bg-gray-700 border border-gray-700/80 rounded-xl p-2 flex items-center justify-between text-left active:scale-95 transition shadow-sm">
      <div class="truncate pr-1">
        <span class="text-[10px] text-gray-400 font-bold block uppercase tracking-wider">Ponto Final:</span>
        <span class="text-xs font-bold text-white truncate block">🏠 Casa Chegada</span>
      </div>
      <span class="text-[10px] font-black px-2 py-0.5 rounded-full border"
            :class="casa.lat ? 'bg-emerald-950 text-emerald-400 border-emerald-800' : 'bg-yellow-950 text-yellow-400 border-yellow-800'"
            x-text="casa.lat ? 'Configurada' : 'Pendente'"></span>
    </button>
  </section>

  <!-- MODO 1: CARREGAMENTO EM SACOLAS DE 10 EM 10 (FOTO 2 REFORMULADA) -->
  <main x-show="modo === 'carregamento'" class="p-4 space-y-3.5">
    <!-- Instrução -->
    <div class="bg-gray-900 p-3.5 rounded-2xl border border-yellow-500/40 text-xs text-yellow-400 space-y-1 shadow-md">
      <p class="font-black text-sm flex items-center gap-1.5">
        <span>👜</span> MÉTODO DAS SACOLAS (10 EM 10)
      </p>
      <p class="text-gray-300 text-xs leading-relaxed">
        Marque o número grande no pacote com canetão (<strong>#1 a #<span x-text="entregas.length"></span></strong>) e coloque na sacola indicada.
      </p>
    </div>

    <!-- Lista de Cards com Tipografia Maior -->
    <div class="space-y-3">
      <template x-for="item in entregas" :key="item.id">
        <div class="bg-gray-900 p-4 rounded-2xl flex items-center justify-between border-l-4 shadow-md transition-all"
             :class="{
               'opacity-20 line-through bg-black border-gray-700': item.status === 'entregue',
               'border-orange-500 hover:border-orange-400': item.status !== 'entregue'
             }">
          
          <!-- Lado Esquerdo: Número e Endereço Ampliados -->
          <div class="flex items-center gap-3.5 flex-1 pr-2">
            <span class="text-3xl font-black bg-gray-800 px-3.5 py-2 rounded-xl border border-gray-700 font-mono text-orange-400 shrink-0" 
                  x-text="`#${item.ordem_entrega}`"></span>
            
            <div class="space-y-0.5 min-w-0">
              <div class="flex items-center gap-2 flex-wrap">
                <p class="font-black text-base text-white leading-snug break-words" x-text="item.endereco"></p>
                <span x-show="item.total_no_local > 1" 
                      class="text-[11px] bg-yellow-500/20 text-yellow-400 border border-yellow-500/40 px-2 py-0.5 rounded-md font-black" 
                      x-text="`${item.total_no_local} PACOTES`"></span>
              </div>
              
              <p class="text-sm font-semibold text-gray-400" x-text="`${item.bairro} - ${item.cidade}`"></p>
              <p class="text-xs text-orange-400/90 font-mono font-bold tracking-wider pt-0.5" x-text="item.codigo_rastreio"></p>
            </div>
          </div>

          <!-- Lado Direito: Badge da Sacola e Setor -->
          <div class="text-right flex flex-col items-end gap-1 shrink-0 pl-1">
            <span class="text-xs font-black px-2.5 py-1 rounded-lg bg-orange-600/25 text-orange-400 border border-orange-500/40 uppercase tracking-wide font-mono" 
                  x-text="`SACOLA ${Math.ceil(item.ordem_entrega / 10)}`"></span>
            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider" 
                  x-text="item.setor_uno ? item.setor_uno.replace('_', ' ') : 'MALA'"></span>
          </div>
        </div>
      </template>
    </div>
  </main>

  <!-- MODO 2: RUA - COCKPIT DE ALTO CONFORTO VISUAL (FOTO 3 REFORMULADA) -->
  <main x-show="modo === 'rua'" class="p-4">
    <template x-if="entregaAtual">
      <div class="bg-gray-900 rounded-3xl p-5 border border-gray-800 space-y-5 shadow-2xl">
        
        <!-- Topo do Card: Número, Sacola e Código de Rastreio em Destaque -->
        <div class="flex justify-between items-start border-b border-gray-800 pb-4 gap-2">
          <div class="flex items-center gap-3">
            <span class="bg-orange-600 text-white font-black text-4xl px-4 py-1.5 rounded-2xl shadow-lg font-mono" 
                  x-text="`#${entregaAtual.ordem_entrega}`"></span>
            
            <div class="space-y-0.5">
              <span class="text-sm font-black text-yellow-400 bg-yellow-500/20 px-3 py-1 rounded-lg border border-yellow-500/40 inline-block uppercase tracking-wide" 
                    x-text="`👜 SACOLA #${Math.ceil(entregaAtual.ordem_entrega / 10)}`"></span>
              <span class="text-[11px] text-gray-400 block font-bold uppercase tracking-wider" 
                    x-text="`Setor: ${entregaAtual.setor_uno ? entregaAtual.setor_uno.replace('_', ' ') : 'MALA'}`"></span>
            </div>
          </div>
          
          <!-- Código de Rastreio com Fonte Maior para Conferência Rápida -->
          <div class="text-right">
            <span class="text-xs text-gray-400 font-bold block uppercase tracking-wider text-[10px]">Rastreio SPX:</span>
            <span class="text-sm bg-gray-800 text-orange-400 border border-gray-700 font-mono font-black px-2.5 py-1 rounded-lg tracking-wider inline-block mt-0.5" 
                  x-text="entregaAtual.codigo_rastreio"></span>
          </div>
        </div>

        <!-- Alerta de Parada com Múltiplos Pacotes (Texto Ampliado) -->
        <div x-show="pacotesMesmoLocal.length > 1" 
             class="bg-yellow-500/10 border-2 border-yellow-500/60 rounded-2xl p-4 space-y-2">
          <p class="text-sm font-black text-yellow-400 flex items-center gap-2">
            <span class="text-lg">⚠️</span> ATENÇÃO: HÁ <span class="underline text-base" x-text="pacotesMesmoLocal.length"></span> PACOTES NESTE LOCAL!
          </p>
          <p class="text-xs text-gray-300 font-medium">Bipe/entregue todos de uma vez antes de sair:</p>
          <div class="flex flex-wrap gap-1.5 pt-1">
            <template x-for="p in pacotesMesmoLocal" :key="p.id">
              <span class="bg-yellow-500/20 text-yellow-300 text-xs font-mono font-bold px-2.5 py-1 rounded-lg border border-yellow-500/40" 
                    x-text="`#${p.ordem_entrega} (${p.codigo_rastreio})`"></span>
            </template>
          </div>
        </div>

        <!-- Endereço com Máxima Legibilidade -->
        <div class="space-y-1.5">
          <h2 class="text-3xl font-black text-white leading-tight break-words" x-text="entregaAtual.endereco"></h2>
          <p class="text-lg text-gray-300 font-bold" x-text="`${entregaAtual.bairro} - ${entregaAtual.cidade}`"></p>
          <p class="text-xs text-gray-400 font-mono tracking-wider" x-text="`CEP: ${entregaAtual.cep || 'S/N'}`"></p>
        </div>

        <!-- Botões Gigantes de Waze e Google Maps -->
        <div class="grid grid-cols-2 gap-3 pt-2">
          <a :href="`waze://?ll=${entregaAtual.latitude},${entregaAtual.longitude}&navigate=yes`" 
             class="bg-blue-600 hover:bg-blue-500 text-center py-4 rounded-2xl font-black text-base flex items-center justify-center gap-2 shadow-xl shadow-blue-600/30 active:scale-95 transition">
            🚗 Abrir Waze
          </a>
          <a :href="`google.navigation:q=${entregaAtual.latitude},${entregaAtual.longitude}`" 
             class="bg-emerald-600 hover:bg-emerald-500 text-center py-4 rounded-2xl font-black text-base flex items-center justify-center gap-2 shadow-xl shadow-emerald-600/30 active:scale-95 transition">
            🗺️ Google Maps
          </a>
        </div>

        <!-- Botões de Ação Final da Parada -->
        <div class="grid grid-cols-2 gap-3 pt-3 border-t border-gray-800">
          <button @click="atualizarStatus(entregaAtual.id, 'ausente')" 
                  class="bg-gray-800 hover:bg-gray-700 text-yellow-400 py-4 rounded-2xl font-bold text-sm border border-gray-700 active:scale-95 transition">
            ⚠️ Ausente / Pular
          </button>
          <button @click="concluirEntrega(entregaAtual)" 
                  class="bg-orange-600 hover:bg-orange-500 text-white py-4 rounded-2xl font-black text-lg shadow-xl shadow-orange-600/40 active:scale-95 transition">
            ✅ Entregue
          </button>
        </div>
      </div>
    </template>

    <template x-if="!entregaAtual && entregas.length > 0">
      <div class="text-center py-24 space-y-4">
        <span class="text-7xl block">🏁</span>
        <h2 class="text-3xl font-black text-white" x-text="`Rota #${rotaAtivaId || ''} Finalizada!`"></h2>
        <p class="text-gray-400 text-sm max-w-xs mx-auto">Parabéns! Todas as sacolas foram finalizadas com sucesso.</p>
      </div>
    </template>
  </main>

  <!-- MODO 3: HISTÓRICO -->
  <main x-show="modo === 'historico'" class="p-4 space-y-4">
    <h2 class="text-xl font-black text-orange-500">📜 Histórico de Rotas</h2>
    <div class="space-y-3">
      <template x-for="r in rotasHistorico" :key="r.id">
        <div class="bg-gray-900 p-4 rounded-2xl border border-gray-800 space-y-2.5">
          <div class="flex justify-between items-center">
            <div>
              <span class="text-base font-black text-white" x-text="`Rota #${r.id}`"></span>
              <p class="text-xs text-gray-400" x-text="`Data: ${r.data ? new Date(r.data).toLocaleDateString('pt-BR') : 'Hoje'}`"></p>
            </div>
            <span class="text-xs bg-orange-600/20 text-orange-400 border border-orange-500/30 px-3 py-1 rounded-full font-bold" x-text="`${r.total_pacotes || 0} pacotes`"></span>
          </div>
          <button @click="selecionarRotaHistorico(r.id)" class="w-full bg-gray-800 hover:bg-gray-700 text-xs py-3 rounded-xl font-bold text-gray-200 border border-gray-700">
            Reabrir Detalhes Desta Rota
          </button>
        </div>
      </template>
    </div>
  </main>

  <!-- MODAL: IMPORTAR ROMANEIO DA SHOPEE -->
  <div x-show="modalImportar" class="fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-4" x-cloak>
    <div class="bg-gray-900 rounded-3xl w-full max-w-lg border border-gray-800 p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-gray-800 pb-3">
        <div>
          <h2 class="font-black text-lg text-orange-500">IMPORTAR ROMANEIO SHOPEE</h2>
          <p class="text-xs text-gray-400">Até 300 pacotes organizados em sacolas</p>
        </div>
        <button @click="modalImportar = false" class="text-gray-400 text-2xl font-bold">&times;</button>
      </div>

      <div x-show="msgErro" class="bg-red-500/20 border border-red-500 p-3 rounded-xl text-xs text-red-200 font-bold" x-text="msgErro"></div>

      <!-- Abas de Importação -->
      <div class="flex border-b border-gray-800 text-xs font-bold">
        <button @click="abaImport = 'arquivo'" :class="abaImport === 'arquivo' ? 'border-b-2 border-orange-500 text-orange-400' : 'text-gray-400'" class="flex-1 py-2.5 text-center">
          📑 Subir Arquivo (.xlsx / .csv)
        </button>
        <button @click="abaImport = 'texto'" :class="abaImport === 'texto' ? 'border-b-2 border-orange-500 text-orange-400' : 'text-gray-400'" class="flex-1 py-2.5 text-center">
          📄 Colar Texto do Romaneio
        </button>
      </div>

      <!-- Aba 1: Arquivo -->
      <div x-show="abaImport === 'arquivo'" class="space-y-3">
        <label class="block border-2 border-dashed border-orange-500/50 bg-orange-500/5 rounded-2xl p-7 text-center cursor-pointer hover:border-orange-500 hover:bg-orange-500/10 transition">
          <span class="text-4xl block mb-2">📊</span>
          <span class="text-sm font-black block text-white">Toque para escolher o arquivo</span>
          <span class="text-xs text-gray-400 block mt-1">Aceita o .XLSX baixado da Shopee</span>
          <input type="file" accept=".xlsx, .xls, .csv, .txt" @change="processarArquivoExcel($event)" class="hidden">
        </label>
        <p x-show="nomeArquivo" class="text-xs text-orange-400 font-bold text-center" x-text="`Arquivo: ${nomeArquivo}`"></p>
      </div>

      <!-- Aba 2: Colar Texto -->
      <div x-show="abaImport === 'texto'" class="space-y-2">
        <textarea x-model="textoColado" @input="processarTextoAoDigitar()" rows="7" placeholder="Cole aqui o texto do romaneio da Shopee..." class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-xs text-white font-mono focus:border-orange-500 focus:outline-none"></textarea>
      </div>

      <!-- Status de Reconhecimento -->
      <div x-show="pacotesExtraidos.length > 0" class="bg-green-500/15 border border-green-500/40 rounded-2xl p-3.5 text-center space-y-1">
        <p class="text-sm text-green-400 font-black" x-text="`✅ ${pacotesExtraidos.length} PACOTES COM GPS DA SHOPEE!`"></p>
        <p class="text-xs text-gray-300 font-medium" x-text="`Carga dividida em ${Math.ceil(pacotesExtraidos.length / 10)} sacolas de 10 pacotes.`"></p>
      </div>

      <button @click="enviarParaN8N()" :disabled="carregandoProcesso || pacotesExtraidos.length === 0" 
              class="w-full py-4 rounded-2xl text-sm font-black flex items-center justify-center gap-2 shadow-xl transition"
              :class="pacotesExtraidos.length > 0 && !carregandoProcesso ? 'bg-orange-600 hover:bg-orange-500 text-white cursor-pointer shadow-orange-600/40' : 'bg-gray-800 text-gray-500 cursor-not-allowed border border-gray-700'">
        <span x-show="!carregandoProcesso" x-text="pacotesExtraidos.length > 0 ? `🚀 Otimizar Rota Partindo do CD (${pacotesExtraidos.length} pacotes)` : 'Aguardando Planilha...'"></span>
        <span x-show="carregandoProcesso">⏳ Otimizando Trajeto no Servidor...</span>
      </button>
    </div>
  </div>

  <!-- MODAL: CONFIGURAR PONTOS CD E CASA -->
  <div x-show="modalCD" class="fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-4" x-cloak>
    <div class="bg-gray-900 rounded-3xl w-full max-w-md border border-gray-800 p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-gray-800 pb-3">
        <h2 class="font-black text-base text-orange-500">PONTOS DE PARTIDA E CHEGADA</h2>
        <button @click="modalCD = false" class="text-gray-400 text-2xl">&times;</button>
      </div>

      <div class="space-y-2 bg-gray-950 p-3.5 rounded-2xl border border-gray-800">
        <label class="text-xs font-bold text-orange-400">🏭 CD SHOPEE (Partida da Rota)</label>
        <button @click="capturarLocalizacao('cd')" class="w-full bg-gray-800 hover:bg-gray-700 text-xs py-3 rounded-xl font-bold text-green-400 border border-gray-700">
          📍 Gravar Meu GPS Atual como CD
        </button>
        <p x-show="cd.lat" class="text-[10px] text-gray-400 font-mono" x-text="`Lat: ${cd.lat.toFixed(5)}, Lng: ${cd.lng.toFixed(5)}`"></p>
      </div>

      <div class="space-y-2 bg-gray-950 p-3.5 rounded-2xl border border-gray-800">
        <label class="text-xs font-bold text-green-400">🏠 SUA CASA (Término da Rota)</label>
        <button @click="capturarLocalizacao('casa')" class="w-full bg-gray-800 hover:bg-gray-700 text-xs py-3 rounded-xl font-bold text-green-400 border border-gray-700">
          📍 Gravar Meu GPS Atual como Casa
        </button>
        <p x-show="casa.lat" class="text-[10px] text-gray-400 font-mono" x-text="`Lat: ${casa.lat.toFixed(5)}, Lng: ${casa.lng.toFixed(5)}`"></p>
      </div>

      <button @click="salvarLocais()" class="w-full bg-orange-600 text-white font-bold py-3.5 rounded-2xl text-xs">
        Salvar Coordenadas
      </button>
    </div>
  </div>

  <script>
    function entregaApp() {
      return {
        modo: 'rua',
        modalImportar: false,
        modalCD: false,
        abaImport: 'arquivo',
        textoColado: '',
        nomeArquivo: '',
        msgErro: null,
        cd: JSON.parse(localStorage.getItem('local_cd') || '{"lat":-24.1667,"lng":-46.7800}'),
        casa: JSON.parse(localStorage.getItem('local_casa') || '{"lat":-24.1739,"lng":-46.7816}'),
        pacotesExtraidos: [],
        carregandoProcesso: false,
        entregas: [],
        rotasHistorico: [],
        rotaAtivaId: null,

        DIRECTUS_URL: 'https://banco.studiotesta.com.br',
        N8N_WEBHOOK_URL: 'https://n8n.studiotesta.com.br/webhook/importar-shopee',

        async init() {
          await this.carregarUltimaRota();

          // SUPORTE AO "ABRIR COM DRIVE XPS" DO ANDROID
          if ('launchQueue' in window && 'files' in LaunchParams.prototype) {
            launchQueue.setConsumer(async (launchParams) => {
              if (!launchParams.files.length) return;
              const fileHandle = launchParams.files[0];
              const file = await fileHandle.getFile();
              this.modalImportar = true;
              this.processarArquivoDireto(file);
            });
          }
        },

        parseLinhasShopee(linhasMatriz) {
          this.msgErro = null;
          if (!linhasMatriz || linhasMatriz.length < 2) {
            this.msgErro = 'Planilha com poucas linhas.';
            return [];
          }

          let idxCabecalho = -1;
          for (let i = 0; i < Math.min(linhasMatriz.length, 10); i++) {
            const rowStr = (linhasMatriz[i] || []).join(' ').toLowerCase();
            if (rowStr.includes('latitude') || rowStr.includes('spx tn') || rowStr.includes('destination address')) {
              idxCabecalho = i;
              break;
            }
          }

          if (idxCabecalho === -1) {
            this.msgErro = 'Colunas "Latitude", "Destination Address" ou "SPX TN" não encontradas.';
            return [];
          }

          const cabecalho = linhasMatriz[idxCabecalho].map(c => String(c || '').trim().toLowerCase());
          const acharIdx = (termos) => cabecalho.findIndex(h => termos.some(t => h.includes(t)));

          const iTN = acharIdx(['spx tn', 'tracking', 'rastreio']);
          const iAddr = acharIdx(['destination address', 'endereço', 'endereco', 'address']);
          const iBairro = acharIdx(['bairro', 'neighborhood']);
          const iCity = acharIdx(['city', 'cidade']);
          const iCep = acharIdx(['zipcode', 'postal', 'cep']);
          const iLat = acharIdx(['latitude', 'lat']);
          const iLng = acharIdx(['longitude', 'lng', 'long']);
          const iStop = acharIdx(['stop', 'parada']);

          if (iLat === -1 || iLng === -1 || iAddr === -1) {
            this.msgErro = 'Colunas de Latitude, Longitude ou Endereço ausentes.';
            return [];
          }

          const lista = [];
          for (let r = idxCabecalho + 1; r < linhasMatriz.length; r++) {
            const cols = linhasMatriz[r];
            if (!cols || cols.length <= Math.max(iLat, iLng)) continue;

            const rawLat = String(cols[iLat] || '').replace(',', '.').trim();
            const rawLng = String(cols[iLng] || '').replace(',', '.').trim();
            const lat = parseFloat(rawLat);
            const lng = parseFloat(rawLng);

            if (!lat || !lng || isNaN(lat) || isNaN(lng) || lat === 0) continue;

            const addr = String(cols[iAddr] || '').trim();
            const stopNum = iStop !== -1 && cols[iStop] ? cols[iStop] : (lista.length + 1);

            let numero = 'S/N';
            const numMatch = addr.match(/,\s*(\d+|S\/?N)/i);
            if (numMatch) numero = numMatch[1];

            lista.push({
              codigo_rastreio: iTN !== -1 && cols[iTN] ? String(cols[iTN]).trim() : `SPX-${lista.length + 1}`,
              destinatario: `Parada #${stopNum}`,
              telefone: '13999999999',
              endereco: addr,
              numero: numero,
              bairro: iBairro !== -1 && cols[iBairro] ? String(cols[iBairro]).trim() : '',
              cidade: iCity !== -1 && cols[iCity] ? String(cols[iCity]).trim() : 'Itanhaém',
              cep: iCep !== -1 && cols[iCep] ? String(cols[iCep]).trim() : '',
              latitude: lat,
              longitude: lng
            });
          }

          return lista;
        },

        processarArquivoDireto(file) {
          this.nomeArquivo = file.name;
          const reader = new FileReader();

          reader.onload = (e) => {
            try {
              const data = new Uint8Array(e.target.result);
              const wb = XLSX.read(data, { type: 'array' });

              let entregasAparecidas = [];
              for (const sheetName of wb.SheetNames) {
                const ws = wb.Sheets[sheetName];
                const matriz = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
                const res = this.parseLinhasShopee(matriz);
                if (res.length > 0) {
                  entregasAparecidas = res;
                  break;
                }
              }

              this.pacotesExtraidos = entregasAparecidas;
              if (this.pacotesExtraidos.length === 0 && !this.msgErro) {
                this.msgErro = 'Nenhum pacote com Latitude e Longitude válidas nesta planilha.';
              }
            } catch (err) {
              this.msgErro = 'Erro ao processar: ' + err.message;
            }
          };

          reader.readAsArrayBuffer(file);
        },

        processarArquivoExcel(event) {
          const file = event.target.files[0];
          if (file) this.processarArquivoDireto(file);
        },

        processarTextoAoDigitar() {
          if (!this.textoColado.trim()) {
            this.pacotesExtraidos = [];
            return;
          }

          const linhas = this.textoColado.trim().split(/\r?\n/).map(l => {
            if (l.includes('\t')) return l.split('\t');
            const re = /(?:,|\n|^)("(?:(?:"")*[^"]*)*"|[^",\n]*|(?:\n|$))/g;
            const row = [];
            let m;
            while ((m = re.exec(l)) !== null) {
              let val = m[1];
              if (val === undefined) break;
              if (val.startsWith('"') && val.endsWith('"')) val = val.slice(1, -1).replace(/""/g, '"');
              row.push(val.trim());
              if (re.lastIndex >= l.length) break;
            }
            return row;
          });

          this.pacotesExtraidos = this.parseLinhasShopee(linhas);
        },

        async carregarUltimaRota() {
          try {
            const resRota = await fetch(`${this.DIRECTUS_URL}/items/rotas?sort=-id&limit=1`);
            const dataRota = await resRota.json();
            if (dataRota.data && dataRota.data.length > 0) {
              this.rotaAtivaId = dataRota.data[0].id;
              const res = await fetch(`${this.DIRECTUS_URL}/items/entregas?filter[rota_id][_eq]=${this.rotaAtivaId}&sort=ordem_entrega&limit=300`);
              const data = await res.json();
              this.entregas = data.data || [];
            }
          } catch(e) {
            console.error('Erro ao carregar rota:', e);
          }
        },

        async abrirHistorico() {
          this.modo = 'historico';
          const res = await fetch(`${this.DIRECTUS_URL}/items/rotas?sort=-id&limit=30`);
          const data = await res.json();
          this.rotasHistorico = data.data || [];
        },

        async selecionarRotaHistorico(rotaId) {
          this.rotaAtivaId = rotaId;
          const res = await fetch(`${this.DIRECTUS_URL}/items/entregas?filter[rota_id][_eq]=${rotaId}&sort=ordem_entrega&limit=300`);
          const data = await res.json();
          this.entregas = data.data || [];
          this.modo = 'carregamento';
        },

        capturarLocalizacao(tipo) {
          if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
              this[tipo].lat = pos.coords.latitude;
              this[tipo].lng = pos.coords.longitude;
              alert(`GPS de ${tipo.toUpperCase()} salvo!`);
            }, err => alert('Erro GPS: ' + err.message));
          }
        },

        salvarLocais() {
          localStorage.setItem('local_cd', JSON.stringify(this.cd));
          localStorage.setItem('local_casa', JSON.stringify(this.casa));
          this.modalCD = false;
        },

        get pendentes() {
          return this.entregas.filter(e => !e.status || e.status === 'pendente');
        },

        get entregaAtual() {
          return this.pendentes[0] || null;
        },

        get pacotesMesmoLocal() {
          if (!this.entregaAtual) return [];
          const cur = this.entregaAtual;
          return this.pendentes.filter(e => 
            (Math.abs(e.latitude - cur.latitude) < 0.0001 && Math.abs(e.longitude - cur.longitude) < 0.0001) ||
            (e.endereco === cur.endereco && e.numero === cur.numero)
          );
        },

        async concluirEntrega(entrega) {
          const mesmoLocal = this.pacotesMesmoLocal;
          if (mesmoLocal.length > 1) {
            const conf = confirm(`Há ${mesmoLocal.length} pacotes neste local. Deseja marcar TODOS como entregues?`);
            if (conf) {
              for (const p of mesmoLocal) {
                await this.atualizarStatus(p.id, 'entregue');
              }
              return;
            }
          }
          await this.atualizarStatus(entrega.id, 'entregue');
        },

        async atualizarStatus(id, novoStatus) {
          const idx = this.entregas.findIndex(e => e.id === id);
          if (idx !== -1) this.entregas[idx].status = novoStatus;

          await fetch(`${this.DIRECTUS_URL}/items/entregas/${id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: novoStatus })
          });
        },

        async enviarParaN8N() {
          this.carregandoProcesso = true;
          try {
            const payload = {
              entregas: this.pacotesExtraidos,
              cd_lat: this.cd.lat,
              cd_lng: this.cd.lng,
              casa_lat: this.casa.lat,
              casa_lng: this.casa.lng
            };

            const res = await fetch(this.N8N_WEBHOOK_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (res.ok) {
              this.modalImportar = false;
              this.pacotesExtraidos = [];
              this.textoColado = '';
              this.nomeArquivo = '';
              await this.carregarUltimaRota();
              this.modo = 'carregamento';
            } else {
              alert('Erro no n8n.');
            }
          } catch(e) {
            alert('Falha: ' + e.message);
          } finally {
            this.carregandoProcesso = false;
          }
        }
      }
    }
  </script>
