<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DriveXPS - Rotas Shopee</title>
  
  <meta name="theme-color" content="#EA580C">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DriveXPS">
  
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <!-- Tailwind, Alpine.js e CDN Ultrarrápido do SheetJS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('ServiceWorker ativo!', reg.scope))
          .catch(err => console.error('Erro no ServiceWorker:', err));
      });
    }
  </script>
</head>
<body class="bg-gray-950 text-white font-sans pb-24 select-none" x-data="entregaApp()">

  <!-- Cabeçalho -->
  <header class="bg-orange-600 p-3.5 sticky top-0 z-40 shadow-lg flex justify-between items-center">
    <div>
      <h1 class="font-black text-lg leading-tight">DriveXPS <span class="text-xs bg-black px-2 py-0.5 rounded font-mono" x-text="rotaAtivaId ? `Rota #${rotaAtivaId}` : 'Shopee Pro'"></span></h1>
      <p class="text-xs opacity-90 font-medium" x-text="`Restantes: ${pendentes.length} de ${entregas.length} pacotes`"></p>
    </div>
    <div class="flex items-center gap-1.5">
      <button @click="modalImportar = true" class="bg-white text-orange-600 px-3 py-1.5 text-xs font-black rounded-lg shadow active:scale-95 transition">
        + Rota
      </button>
      <button @click="modo = 'carregamento'" :class="modo === 'carregamento' ? 'bg-black text-white' : 'bg-orange-700'" class="px-2.5 py-1.5 text-xs font-bold rounded-lg">📦 Sacolas</button>
      <button @click="modo = 'rua'" :class="modo === 'rua' ? 'bg-black text-white' : 'bg-orange-700'" class="px-2.5 py-1.5 text-xs font-bold rounded-lg">🚗 Rua</button>
      <button @click="abrirHistorico()" :class="modo === 'historico' ? 'bg-black text-white' : 'bg-orange-700'" class="px-2.5 py-1.5 text-xs font-bold rounded-lg">📜</button>
    </div>
  </header>

  <!-- Barra de Configuração GPS -->
  <div class="bg-gray-900 px-4 py-2 border-b border-gray-800 flex justify-between text-[11px] text-gray-300">
    <button @click="modalCD = true" class="hover:underline flex items-center gap-1">
      🏭 CD Saída: <span :class="cd.lat ? 'text-green-400 font-bold' : 'text-yellow-400 font-bold'" x-text="cd.lat ? 'Configurado' : 'Pendente'"></span>
    </button>
    <button @click="modalCD = true" class="hover:underline flex items-center gap-1">
      🏠 Casa Chegada: <span :class="casa.lat ? 'text-green-400 font-bold' : 'text-yellow-400 font-bold'" x-text="casa.lat ? 'Configurada' : 'Pendente'"></span>
    </button>
  </div>

  <!-- MODO 1: CARREGAMENTO EM SACOLAS DE 10 EM 10 -->
  <main x-show="modo === 'carregamento'" class="p-4 space-y-4">
    <div class="bg-gray-900 p-3.5 rounded-xl border border-yellow-500/40 text-xs text-yellow-400 space-y-1">
      <p class="font-bold flex items-center gap-1">👜 MÉTODO DAS SACOLAS NUMERADAS (10 em 10):</p>
      <p class="text-gray-300 text-[11px]">Marque o número no pacote (<strong>#1 a #<span x-text="entregas.length"></span></strong>) com o canetão e guarde direto na Sacola correspondente.</p>
    </div>

    <div class="space-y-2.5">
      <template x-for="item in entregas" :key="item.id">
        <div class="bg-gray-900 p-3.5 rounded-xl flex items-center justify-between border-l-4 transition-all"
             :class="{
               'opacity-25 line-through bg-black border-gray-700': item.status === 'entregue',
               'border-orange-500': item.status !== 'entregue'
             }">
          <div class="flex items-center gap-3">
            <span class="text-2xl font-black bg-gray-800 px-3 py-1.5 rounded-lg border border-gray-700 font-mono" x-text="`#${item.ordem_entrega}`"></span>
            <div>
              <div class="flex items-center gap-2">
                <p class="font-bold text-sm text-white" x-text="item.endereco"></p>
                <span x-show="item.total_no_local > 1" class="text-[10px] bg-yellow-500/20 text-yellow-400 border border-yellow-500/40 px-1.5 py-0.2 rounded font-black" x-text="`${item.total_no_local} PACOTES`"></span>
              </div>
              <p class="text-xs text-gray-400" x-text="`${item.bairro} - ${item.cidade}`"></p>
              <p class="text-[10px] text-orange-400 font-mono mt-0.5" x-text="item.codigo_rastreio"></p>
            </div>
          </div>
          <div class="text-right flex flex-col items-end gap-1">
            <span class="text-[10px] font-black px-2 py-0.5 rounded bg-orange-600/20 text-orange-400 border border-orange-500/30 uppercase tracking-wider" x-text="`Sacola ${Math.ceil(item.ordem_entrega / 10)}`"></span>
            <span class="text-[9px] font-bold text-gray-400 uppercase" x-text="item.setor_uno ? item.setor_uno.replace('_', ' ') : 'MALA'"></span>
          </div>
        </div>
      </template>
    </div>
  </main>

  <!-- MODO 2: RUA (Cockpit de Navegação) -->
  <main x-show="modo === 'rua'" class="p-4">
    <template x-if="entregaAtual">
      <div class="bg-gray-900 rounded-2xl p-5 border border-gray-800 space-y-4 shadow-2xl">
        <div class="flex justify-between items-center border-b border-gray-800 pb-3">
          <div class="flex items-center gap-3">
            <span class="bg-orange-600 text-white font-black text-3xl px-3.5 py-1 rounded-xl shadow-md font-mono" x-text="`#${entregaAtual.ordem_entrega}`"></span>
            <div>
              <span class="text-xs font-black text-yellow-400 bg-yellow-500/20 px-2 py-0.5 rounded border border-yellow-500/30 inline-block uppercase" x-text="`👜 SACOLA #${Math.ceil(entregaAtual.ordem_entrega / 10)}`"></span>
              <span class="text-[10px] text-gray-400 block mt-0.5 uppercase font-bold" x-text="`Local: ${entregaAtual.setor_uno ? entregaAtual.setor_uno.replace('_', ' ') : 'MALA'}`"></span>
            </div>
          </div>
          <span class="text-xs bg-gray-800 text-orange-400 border border-gray-700 font-mono font-bold px-2.5 py-1 rounded" x-text="entregaAtual.codigo_rastreio"></span>
        </div>

        <div x-show="pacotesMesmoLocal.length > 1" class="bg-yellow-500/10 border-2 border-yellow-500/60 rounded-xl p-3 space-y-1">
          <p class="text-xs font-black text-yellow-400 flex items-center gap-1">
            ⚠️ ATENÇÃO: HÁ <span x-text="pacotesMesmoLocal.length"></span> PACOTES NESTE LOCAL!
          </p>
          <div class="flex flex-wrap gap-1 pt-1">
            <template x-for="p in pacotesMesmoLocal" :key="p.id">
              <span class="bg-yellow-500/20 text-yellow-300 text-[10px] font-mono px-2 py-0.5 rounded border border-yellow-500/30" x-text="`#${p.ordem_entrega} (${p.codigo_rastreio})`"></span>
            </template>
          </div>
        </div>

        <div class="space-y-1">
          <h2 class="text-2xl font-black text-white leading-tight" x-text="entregaAtual.endereco"></h2>
          <p class="text-base text-gray-300 font-semibold" x-text="`${entregaAtual.bairro} - ${entregaAtual.cidade}`"></p>
          <p class="text-xs text-gray-400 font-mono" x-text="`CEP: ${entregaAtual.cep || 'S/N'}`"></p>
        </div>

        <div class="grid grid-cols-2 gap-3 pt-2">
          <a :href="`waze://?ll=${entregaAtual.latitude},${entregaAtual.longitude}&navigate=yes`" 
             class="bg-blue-600 hover:bg-blue-500 text-center py-4 rounded-xl font-black text-base flex items-center justify-center gap-2 shadow-lg shadow-blue-600/30 active:scale-95 transition">
            🚗 Abrir Waze
          </a>
          <a :href="`google.navigation:q=${entregaAtual.latitude},${entregaAtual.longitude}`" 
             class="bg-emerald-600 hover:bg-emerald-500 text-center py-4 rounded-xl font-black text-base flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/30 active:scale-95 transition">
            🗺️ Google Maps
          </a>
        </div>

        <div class="grid grid-cols-2 gap-3 pt-3 border-t border-gray-800">
          <button @click="atualizarStatus(entregaAtual.id, 'ausente')" class="bg-gray-800 hover:bg-gray-700 text-yellow-400 py-4 rounded-xl font-bold text-sm border border-gray-700 active:scale-95 transition">
            ⚠️ Ausente / Pular
          </button>
          <button @click="concluirEntrega(entregaAtual)" class="bg-orange-600 hover:bg-orange-500 text-white py-4 rounded-xl font-black text-lg shadow-lg shadow-orange-600/40 active:scale-95 transition">
            ✅ Entregue
          </button>
        </div>
      </div>
    </template>

    <template x-if="!entregaAtual && entregas.length > 0">
      <div class="text-center py-20 space-y-4">
        <span class="text-6xl block">🏁</span>
        <h2 class="text-2xl font-black text-white" x-text="`Rota #${rotaAtivaId || ''} Finalizada!`"></h2>
        <p class="text-gray-400 text-sm max-w-xs mx-auto">Parabéns! Todas as sacolas foram finalizadas.</p>
      </div>
    </template>
  </main>

  <!-- MODO 3: HISTÓRICO -->
  <main x-show="modo === 'historico'" class="p-4 space-y-4">
    <h2 class="text-lg font-black text-orange-500">📜 Histórico de Rotas</h2>
    <div class="space-y-3">
      <template x-for="r in rotasHistorico" :key="r.id">
        <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-2">
          <div class="flex justify-between items-center">
            <div>
              <span class="text-base font-black text-white" x-text="`Rota #${r.id}`"></span>
              <p class="text-xs text-gray-400" x-text="`Data: ${r.data ? new Date(r.data).toLocaleDateString('pt-BR') : 'Hoje'}`"></p>
            </div>
            <span class="text-xs bg-orange-600/20 text-orange-400 border border-orange-500/30 px-3 py-1 rounded-full font-bold" x-text="`${r.total_pacotes || 0} pacotes`"></span>
          </div>
          <button @click="selecionarRotaHistorico(r.id)" class="w-full bg-gray-800 hover:bg-gray-700 text-xs py-2.5 rounded-lg font-bold text-gray-200">
            Reabrir Detalhes Desta Rota
          </button>
        </div>
      </template>
    </div>
  </main>

  <!-- MODAL: IMPORTAR ROMANEIO SHOPEE -->
  <div x-show="modalImportar" class="fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-4" x-cloak>
    <div class="bg-gray-900 rounded-2xl w-full max-w-lg border border-gray-800 p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-gray-800 pb-3">
        <div>
          <h2 class="font-black text-lg text-orange-500">IMPORTAR ROMANEIO SHOPEE</h2>
          <p class="text-xs text-gray-400">Até 300 pacotes organizados em sacolas</p>
        </div>
        <button @click="modalImportar = false" class="text-gray-400 text-2xl font-bold">&times;</button>
      </div>

      <!-- Alerta de Erro Visual -->
      <div x-show="msgErro" class="bg-red-500/20 border border-red-500 p-3 rounded-xl text-xs text-red-200 font-bold" x-text="msgErro"></div>

      <!-- Abas de Importação -->
      <div class="flex border-b border-gray-800 text-xs font-bold">
        <button @click="abaImport = 'arquivo'" :class="abaImport === 'arquivo' ? 'border-b-2 border-orange-500 text-orange-400' : 'text-gray-400'" class="flex-1 py-2 text-center">
          📑 Subir Arquivo (.xlsx / .csv)
        </button>
        <button @click="abaImport = 'texto'" :class="abaImport === 'texto' ? 'border-b-2 border-orange-500 text-orange-400' : 'text-gray-400'" class="flex-1 py-2 text-center">
          📄 Colar Texto do Romaneio
        </button>
      </div>

      <!-- Aba 1: Subir Arquivo -->
      <div x-show="abaImport === 'arquivo'" class="space-y-3">
        <label class="block border-2 border-dashed border-orange-500/50 bg-orange-500/5 rounded-2xl p-7 text-center cursor-pointer hover:border-orange-500 hover:bg-orange-500/10 transition">
          <span class="text-4xl block mb-2">📊</span>
          <span class="text-sm font-black block text-white">Toque para escolher a planilha</span>
          <span class="text-xs text-gray-400 block mt-1">Aceita arquivo .XLSX oficial ou .CSV</span>
          <input type="file" accept=".xlsx, .xls, .csv, .txt" @change="processarArquivoExcel($event)" class="hidden">
        </label>
        <p x-show="nomeArquivo" class="text-xs text-orange-400 font-bold text-center" x-text="`Arquivo: ${nomeArquivo}`"></p>
      </div>

      <!-- Aba 2: Colar Texto -->
      <div x-show="abaImport === 'texto'" class="space-y-2">
        <textarea x-model="textoColado" @input="processarTextoAoDigitar()" rows="7" placeholder="Cole aqui o texto copiado da planilha da Shopee (ele reconhece na mesma hora)..." class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-xs text-white font-mono focus:border-orange-500 focus:outline-none"></textarea>
      </div>

      <!-- Confirmação Verde -->
      <div x-show="pacotesExtraidos.length > 0" class="bg-green-500/15 border border-green-500/40 rounded-xl p-3 text-center space-y-1">
        <p class="text-sm text-green-400 font-black" x-text="`✅ ${pacotesExtraidos.length} PACOTES RECONHECIDOS COM GPS!`"></p>
        <p class="text-xs text-gray-300 font-medium" x-text="`Serão geradas ${Math.ceil(pacotesExtraidos.length / 10)} sacolas de 10 pacotes cada.`"></p>
      </div>

      <!-- Botão de Envio (Acende assim que houver pacotes) -->
      <button @click="enviarParaN8N()" :disabled="carregandoProcesso || pacotesExtraidos.length === 0" 
              class="w-full py-4 rounded-xl text-sm font-black flex items-center justify-center gap-2 shadow-xl transition"
              :class="pacotesExtraidos.length > 0 && !carregandoProcesso ? 'bg-orange-600 hover:bg-orange-500 text-white cursor-pointer shadow-orange-600/40' : 'bg-gray-800 text-gray-500 cursor-not-allowed border border-gray-700'">
        <span x-show="!carregandoProcesso" x-text="pacotesExtraidos.length > 0 ? `🚀 Otimizar Rota (${pacotesExtraidos.length} pacotes)` : 'Aguardando Planilha...'"></span>
        <span x-show="carregandoProcesso">⏳ Otimizando Trajeto no Servidor...</span>
      </button>
    </div>
  </div>

  <!-- MODAL: CONFIGURAR PONTOS CD E CASA -->
  <div x-show="modalCD" class="fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-4" x-cloak>
    <div class="bg-gray-900 rounded-2xl w-full max-w-md border border-gray-800 p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-gray-800 pb-3">
        <h2 class="font-black text-base text-orange-500">PONTOS DE PARTIDA E CHEGADA</h2>
        <button @click="modalCD = false" class="text-gray-400 text-2xl">&times;</button>
      </div>

      <div class="space-y-2 bg-gray-950 p-3.5 rounded-xl border border-gray-800">
        <label class="text-xs font-bold text-orange-400">🏭 CD SHOPEE (Partida da Rota)</label>
        <button @click="capturarLocalizacao('cd')" class="w-full bg-gray-800 hover:bg-gray-700 text-xs py-2.5 rounded-lg font-bold text-green-400 border border-gray-700">
          📍 Gravar Minha Localização Atual como CD
        </button>
        <p x-show="cd.lat" class="text-[10px] text-gray-400 font-mono" x-text="`Lat: ${cd.lat.toFixed(5)}, Lng: ${cd.lng.toFixed(5)}`"></p>
      </div>

      <div class="space-y-2 bg-gray-950 p-3.5 rounded-xl border border-gray-800">
        <label class="text-xs font-bold text-green-400">🏠 SUA CASA (Término da Rota)</label>
        <button @click="capturarLocalizacao('casa')" class="w-full bg-gray-800 hover:bg-gray-700 text-xs py-2.5 rounded-lg font-bold text-green-400 border border-gray-700">
          📍 Gravar Minha Localização Atual como Casa
        </button>
        <p x-show="casa.lat" class="text-[10px] text-gray-400 font-mono" x-text="`Lat: ${casa.lat.toFixed(5)}, Lng: ${casa.lng.toFixed(5)}`"></p>
      </div>

      <button @click="salvarLocais()" class="w-full bg-orange-600 text-white font-bold py-3 rounded-xl text-xs">
        Salvar Coordenadas
      </button>
    </div>
  </div>

  <script>
    function entregaApp() {
      return {
        modo: 'rua',
        modalImportar: false,
        modalCD: false,
        abaImport: 'arquivo',
        textoColado: '',
        nomeArquivo: '',
        msgErro: null,
        cd: JSON.parse(localStorage.getItem('local_cd') || '{"lat":-24.1667,"lng":-46.7800}'),
        casa: JSON.parse(localStorage.getItem('local_casa') || '{"lat":-24.1739,"lng":-46.7816}'),
        pacotesExtraidos: [],
        carregandoProcesso: false,
        entregas: [],
        rotasHistorico: [],
        rotaAtivaId: null,

        DIRECTUS_URL: 'https://banco.studiotesta.com.br',
        N8N_WEBHOOK_URL: 'https://n8n.studiotesta.com.br/webhook/importar-shopee',

        async init() {
          await this.carregarUltimaRota();
        },

        // Parser Universal Blindado
        parseLinhasShopee(linhasMatriz) {
          this.msgErro = null;
          if (!linhasMatriz || linhasMatriz.length < 2) {
            this.msgErro = 'O arquivo contém poucas linhas para ser um romaneio.';
            return [];
          }

          // 1. Encontra a linha onde estão os cabeçalhos reais (evita cabeçalhos deslocados da Shopee)
          let idxCabecalho = -1;
          for (let i = 0; i < Math.min(linhasMatriz.length, 10); i++) {
            const rowStr = (linhasMatriz[i] || []).join(' ').toLowerCase();
            if (rowStr.includes('latitude') || rowStr.includes('spx tn') || rowStr.includes('destination address')) {
              idxCabecalho = i;
              break;
            }
          }

          if (idxCabecalho === -1) {
            this.msgErro = 'Não encontramos as colunas "Latitude", "Destination Address" ou "SPX TN" na planilha.';
            return [];
          }

          const cabecalho = linhasMatriz[idxCabecalho].map(c => String(c || '').trim().toLowerCase());
          
          const acharIdx = (termos) => cabecalho.findIndex(h => termos.some(t => h.includes(t)));

          const iTN = acharIdx(['spx tn', 'tracking', 'rastreio']);
          const iAddr = acharIdx(['destination address', 'endereço', 'endereco', 'address']);
          const iBairro = acharIdx(['bairro', 'neighborhood']);
          const iCity = acharIdx(['city', 'cidade']);
          const iCep = acharIdx(['zipcode', 'postal', 'cep']);
          const iLat = acharIdx(['latitude', 'lat']);
          const iLng = acharIdx(['longitude', 'lng', 'long']);
          const iStop = acharIdx(['stop', 'parada']);

          if (iLat === -1 || iLng === -1 || iAddr === -1) {
            this.msgErro = 'Colunas essenciais (Latitude, Longitude ou Endereço) não foram encontradas.';
            return [];
          }

          const lista = [];
          for (let r = idxCabecalho + 1; r < linhasMatriz.length; r++) {
            const cols = linhasMatriz[r];
            if (!cols || cols.length <= Math.max(iLat, iLng)) continue;

            // Corrige vírgulas brasileiras: "-24,1667" -> "-24.1667"
            const rawLat = String(cols[iLat] || '').replace(',', '.').trim();
            const rawLng = String(cols[iLng] || '').replace(',', '.').trim();
            const lat = parseFloat(rawLat);
            const lng = parseFloat(rawLng);

            if (!lat || !lng || isNaN(lat) || isNaN(lng) || lat === 0) continue;

            const addr = String(cols[iAddr] || '').trim();
            const stopNum = iStop !== -1 && cols[iStop] ? cols[iStop] : (lista.length + 1);

            let numero = 'S/N';
            const numMatch = addr.match(/,\s*(\d+|S\/?N)/i);
            if (numMatch) numero = numMatch[1];

            lista.push({
              codigo_rastreio: iTN !== -1 && cols[iTN] ? String(cols[iTN]).trim() : `SPX-${lista.length + 1}`,
              destinatario: `Parada #${stopNum}`,
              telefone: '13999999999',
              endereco: addr,
              numero: numero,
              bairro: iBairro !== -1 && cols[iBairro] ? String(cols[iBairro]).trim() : '',
              cidade: iCity !== -1 && cols[iCity] ? String(cols[iCity]).trim() : 'Itanhaém',
              cep: iCep !== -1 && cols[iCep] ? String(cols[iCep]).trim() : '',
              latitude: lat,
              longitude: lng
            });
          }

          return lista;
        },

        processarArquivoExcel(event) {
          const file = event.target.files[0];
          if (!file) return;

          this.nomeArquivo = file.name;
          const reader = new FileReader();

          reader.onload = (e) => {
            try {
              if (typeof XLSX === 'undefined') {
                this.msgErro = 'Erro: A biblioteca de leitura XLSX não carregou. Verifique sua conexão com a internet.';
                return;
              }

              const data = new Uint8Array(e.target.result);
              const wb = XLSX.read(data, { type: 'array' });

              // Procura em todas as abas até achar uma que tenha as entregas
              let entregasAparecidas = [];
              for (const sheetName of wb.SheetNames) {
                const ws = wb.Sheets[sheetName];
                const matriz = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
                const res = this.parseLinhasShopee(matriz);
                if (res.length > 0) {
                  entregasAparecidas = res;
                  break;
                }
              }

              this.pacotesExtraidos = entregasAparecidas;

              if (this.pacotesExtraidos.length === 0 && !this.msgErro) {
                this.msgErro = 'Nenhum pacote com Latitude e Longitude válidas foi encontrado nesta planilha.';
              }
            } catch (err) {
              this.msgErro = 'Falha ao processar arquivo Excel: ' + err.message;
            }
          };

          reader.readAsArrayBuffer(file);
        },

        processarTextoAoDigitar() {
          if (!this.textoColado.trim()) {
            this.pacotesExtraidos = [];
            return;
          }

          // Parser CSV/TSV direto em texto sem depender de biblioteca
          const linhas = this.textoColado.trim().split(/\r?\n/).map(l => {
            if (l.includes('\t')) return l.split('\t'); // Copiado direto do Excel (TSV)
            // Se for CSV com vírgula e aspas
            const re = /(?:,|\n|^)("(?:(?:"")*[^"]*)*"|[^",\n]*|(?:\n|$))/g;
            const row = [];
            let m;
            while ((m = re.exec(l)) !== null) {
              let val = m[1];
              if (val === undefined) break;
              if (val.startsWith('"') && val.endsWith('"')) val = val.slice(1, -1).replace(/""/g, '"');
              row.push(val.trim());
              if (re.lastIndex >= l.length) break;
            }
            return row;
          });

          this.pacotesExtraidos = this.parseLinhasShopee(linhas);
        },

        async carregarUltimaRota() {
          try {
            const resRota = await fetch(`${this.DIRECTUS_URL}/items/rotas?sort=-id&limit=1`);
            const dataRota = await resRota.json();
            if (dataRota.data && dataRota.data.length > 0) {
              this.rotaAtivaId = dataRota.data[0].id;
              const res = await fetch(`${this.DIRECTUS_URL}/items/entregas?filter[rota_id][_eq]=${this.rotaAtivaId}&sort=ordem_entrega&limit=300`);
              const data = await res.json();
              this.entregas = data.data || [];
            }
          } catch(e) {
            console.error('Erro ao carregar rota:', e);
          }
        },

        async abrirHistorico() {
          this.modo = 'historico';
          const res = await fetch(`${this.DIRECTUS_URL}/items/rotas?sort=-id&limit=30`);
          const data = await res.json();
          this.rotasHistorico = data.data || [];
        },

        async selecionarRotaHistorico(rotaId) {
          this.rotaAtivaId = rotaId;
          const res = await fetch(`${this.DIRECTUS_URL}/items/entregas?filter[rota_id][_eq]=${rotaId}&sort=ordem_entrega&limit=300`);
          const data = await res.json();
          this.entregas = data.data || [];
          this.modo = 'carregamento';
        },

        capturarLocalizacao(tipo) {
          if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
              this[tipo].lat = pos.coords.latitude;
              this[tipo].lng = pos.coords.longitude;
              alert(`GPS de ${tipo.toUpperCase()} salvo com sucesso!`);
            }, err => alert('Erro GPS: ' + err.message));
          }
        },

        salvarLocais() {
          localStorage.setItem('local_cd', JSON.stringify(this.cd));
          localStorage.setItem('local_casa', JSON.stringify(this.casa));
          this.modalCD = false;
        },

        get pendentes() {
          return this.entregas.filter(e => !e.status || e.status === 'pendente');
        },

        get entregaAtual() {
          return this.pendentes[0] || null;
        },

        get pacotesMesmoLocal() {
          if (!this.entregaAtual) return [];
          const cur = this.entregaAtual;
          return this.pendentes.filter(e => 
            (Math.abs(e.latitude - cur.latitude) < 0.0001 && Math.abs(e.longitude - cur.longitude) < 0.0001) ||
            (e.endereco === cur.endereco && e.numero === cur.numero)
          );
        },

        async concluirEntrega(entrega) {
          const mesmoLocal = this.pacotesMesmoLocal;
          if (mesmoLocal.length > 1) {
            const conf = confirm(`Há ${mesmoLocal.length} pacotes neste endereço. Deseja marcar TODOS como entregues de uma vez?`);
            if (conf) {
              for (const p of mesmoLocal) {
                await this.atualizarStatus(p.id, 'entregue');
              }
              return;
            }
          }
          await this.atualizarStatus(entrega.id, 'entregue');
        },

        async atualizarStatus(id, novoStatus) {
          const idx = this.entregas.findIndex(e => e.id === id);
          if (idx !== -1) this.entregas[idx].status = novoStatus;

          await fetch(`${this.DIRECTUS_URL}/items/entregas/${id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: novoStatus })
          });
        },

        async enviarParaN8N() {
          this.carregandoProcesso = true;
          try {
            const payload = {
              entregas: this.pacotesExtraidos,
              cd_lat: this.cd.lat,
              cd_lng: this.cd.lng,
              casa_lat: this.casa.lat,
              casa_lng: this.casa.lng
            };

            const res = await fetch(this.N8N_WEBHOOK_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (res.ok) {
              this.modalImportar = false;
              this.pacotesExtraidos = [];
              this.textoColado = '';
              this.nomeArquivo = '';
              await this.carregarUltimaRota();
              this.modo = 'carregamento';
            } else {
              alert('Erro na resposta do n8n.');
            }
          } catch(e) {
            alert('Falha na comunicação: ' + e.message);
          } finally {
            this.carregandoProcesso = false;
          }
        }
      }
    }
  </script>
